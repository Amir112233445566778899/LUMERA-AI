<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>

<title>Lumera AI</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
:root,[data-theme="space"]{--bg:#030712;--card:rgba(15,23,42,.88);--line:rgba(148,163,184,.2);--text:#f1f5f9;--muted:#94a3b8;--a:#22d3ee;--b:#a78bfa;--glow:rgba(34,211,238,.45)}
[data-theme="dark"]{--bg:#050505;--card:rgba(20,20,20,.94);--line:rgba(255,255,255,.1);--text:#fafafa;--muted:#a3a3a3;--a:#60a5fa;--b:#818cf8;--glow:rgba(96,165,250,.4)}
[data-theme="light"]{--bg:#f8fafc;--card:rgba(255,255,255,.96);--line:rgba(15,23,42,.1);--text:#0f172a;--muted:#64748b;--a:#0891b2;--b:#7c3aed;--glow:rgba(8,145,178,.25)}
[data-theme="sunset"]{--bg:#1c0a0a;--card:rgba(50,15,15,.92);--line:rgba(251,146,60,.22);--text:#fff7ed;--muted:#fdba74;--a:#fb923c;--b:#f43f5e;--glow:rgba(251,146,60,.4)}
[data-theme="ocean"]{--bg:#020e1a;--card:rgba(3,35,55,.92);--line:rgba(34,211,238,.2);--text:#e0f7ff;--muted:#7dd3fc;--a:#06b6d4;--b:#3b82f6;--glow:rgba(6,182,212,.4)}
[data-theme="neon"]{--bg:#0a0012;--card:rgba(28,0,48,.94);--line:rgba(236,72,153,.28);--text:#fdf4ff;--muted:#e879f9;--a:#f472b6;--b:#22d3ee;--glow:rgba(244,114,182,.5)}
[data-theme="forest"]{--bg:#03120a;--card:rgba(8,36,18,.94);--line:rgba(74,222,128,.2);--text:#ecfdf5;--muted:#86efac;--a:#4ade80;--b:#14b8a6;--glow:rgba(74,222,128,.35)}
[data-theme="gold"]{--bg:#17110a;--card:rgba(42,32,12,.94);--line:rgba(251,191,36,.25);--text:#fffbeb;--muted:#fcd34d;--a:#fbbf24;--b:#f97316;--glow:rgba(251,191,36,.4)}
[data-theme="ice"]{--bg:#0a1220;--card:rgba(14,28,48,.94);--line:rgba(147,197,253,.22);--text:#eff6ff;--muted:#93c5fd;--a:#60a5fa;--b:#a5b4fc;--glow:rgba(96,165,250,.35)}
[data-theme="rose"]{--bg:#180a12;--card:rgba(42,14,28,.94);--line:rgba(251,113,133,.22);--text:#fff1f2;--muted:#fda4af;--a:#fb7185;--b:#e879f9;--glow:rgba(251,113,133,.4)}
[data-theme="midnight"]{--bg:#020617;--card:rgba(15,23,42,.96);--line:rgba(99,102,241,.25);--text:#e2e8f0;--muted:#94a3b8;--a:#818cf8;--b:#c084fc;--glow:rgba(129,140,248,.4)}
[data-theme="aurora"]{--bg:#061018;--card:rgba(8,30,40,.92);--line:rgba(52,211,153,.25);--text:#ecfdf5;--muted:#6ee7b7;--a:#34d399;--b:#22d3ee;--glow:rgba(52,211,153,.45)}
[data-theme="lava"]{--bg:#1a0800;--card:rgba(40,12,4,.94);--line:rgba(249,115,22,.3);--text:#fff7ed;--muted:#fdba74;--a:#f97316;--b:#ef4444;--glow:rgba(249,115,22,.5)}
[data-theme="violet"]{--bg:#0c0618;--card:rgba(24,12,48,.94);--line:rgba(167,139,250,.28);--text:#f5f3ff;--muted:#c4b5fd;--a:#a78bfa;--b:#e879f9;--glow:rgba(167,139,250,.45)}
[data-theme="cyber"]{--bg:#020b0f;--card:rgba(0,20,28,.94);--line:rgba(34,211,238,.3);--text:#ecfeff;--muted:#67e8f9;--a:#22d3ee;--b:#4ade80;--glow:rgba(34,211,238,.55)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Vazirmatn,system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100dvh;overflow-x:hidden}
#bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1000px 560px at 10% -10%, color-mix(in srgb,var(--a) 30%, transparent), transparent 55%),
  radial-gradient(800px 480px at 100% 0%, color-mix(in srgb,var(--b) 24%, transparent), transparent 50%),
  radial-gradient(600px 400px at 50% 120%, color-mix(in srgb,var(--a) 12%, transparent), transparent 50%),
  var(--bg)}
#bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px}
#bg-orb{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;pointer-events:none;background:var(--a);top:10%;left:10%;animation:orb 12s ease-in-out infinite alternate}
#bg-orb2{position:fixed;width:220px;height:220px;border-radius:50%;filter:blur(50px);opacity:.28;z-index:0;pointer-events:none;background:var(--b);bottom:8%;right:8%;animation:orb 15s ease-in-out infinite alternate-reverse}
@keyframes orb{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}
#app-root{position:relative;z-index:1;min-height:100dvh}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(0,0,0,.18)}
.btn{border:0;border-radius:14px;padding:.72rem .95rem;font-weight:700;cursor:pointer;color:var(--text);transition:.15s transform,.15s box-shadow}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--a),var(--b));color:#041018;box-shadow:0 0 24px var(--glow)}
.btn-primary:hover{box-shadow:0 0 36px var(--glow)}
.btn-ghost{background:color-mix(in srgb,var(--text) 7%,transparent)}
.input{width:100%;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 50%,transparent);color:var(--text);padding:.8rem 1rem;outline:none}
.input:focus{border-color:color-mix(in srgb,var(--a) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
.msg-user{background:color-mix(in srgb,var(--a) 16%,transparent);border:1px solid color-mix(in srgb,var(--a) 22%,transparent)}
.msg-ai{background:color-mix(in srgb,var(--bg) 65%,transparent);border:1px solid var(--line)}
.badge{font-size:10px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}
.badge.owner{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1917}
.hidden{display:none!important}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
#fab{position:fixed;bottom:18px;left:18px;z-index:90;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#041018;box-shadow:0 0 28px var(--glow)}
.err{color:#fca5a5;font-size:12px;min-height:16px}.ok{color:#6ee7b7;font-size:12px}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;font-size:11px;margin:3px;cursor:pointer;background:color-mix(in srgb,var(--text) 7%,transparent);border:1px solid var(--line);transition:.15s}
.chip:hover,.chip.on{border-color:var(--a);color:var(--a);box-shadow:0 0 12px color-mix(in srgb,var(--a) 25%,transparent)}
.wordbar{height:4px;border-radius:99px;background:color-mix(in srgb,var(--text) 10%,transparent);overflow:hidden}
.wordbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .35s;box-shadow:0 0 10px var(--glow)}
.tool-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool-grid button{font-size:10px;padding:.5rem .25rem;line-height:1.25}
.act-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.act-row button{font-size:10px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.file-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;font-size:11px;background:color-mix(in srgb,var(--a) 12%,transparent);border:1px solid var(--line);max-width:100%}
.file-chip img{width:36px;height:36px;object-fit:cover;border-radius:8px}
.logo-shine{background:linear-gradient(135deg,var(--a),var(--b),var(--a));background-size:200% auto;-webkit-background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
#drop-overlay{display:none;position:fixed;inset:0;z-index:80;background:rgba(2,6,23,.72);border:3px dashed var(--a);align-items:center;justify-content:center;font-size:18px;font-weight:800}
#drop-overlay.on{display:flex}
#wave{display:none;height:28px;align-items:flex-end;gap:3px;padding:0 6px}
#wave.on{display:flex}
#wave span{width:3px;background:var(--a);border-radius:2px;animation:wav .4s ease-in-out infinite alternate}
#wave span:nth-child(2){animation-delay:.1s}#wave span:nth-child(3){animation-delay:.2s}
@keyframes wav{from{height:6px}to{height:22px}}
.intro-pop{animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:640px){.tool-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body data-theme="space">
<div id="bg-layer"></div>
<div id="bg-grid"></div>
<div id="bg-orb"></div>
<div id="bg-orb2"></div>
<div id="drop-overlay">فایل را رها کن ✦</div>
<div id="app-root">

<button id="fab" type="button" onclick="openSettings()">تنظیمات</button>

<div id="auth" class="min-h-dvh flex items-center justify-center p-4">
  <div class="glass w-full max-w-md p-6 space-y-4 intro-pop">
    <div class="text-center">
      <div class="text-4xl font-extrabold logo-shine">Lumera AI</div>
      <p class="text-sm mt-2" style="color:var(--muted)">چت · ویس · تصویر · PDF · ویدیو</p>
    </div>
    <div class="space-y-3">
      <label class="text-xs" style="color:var(--muted)">ایمیل</label>
      <input id="email" class="input" type="email" placeholder="you@email.com" oninput="liveValidateEmail()"/>
      <p id="email-hint" class="err"></p>
      <button class="btn btn-primary w-full" onclick="startAuth()">ورود به جهان AI</button>
      <button class="btn btn-ghost w-full" onclick="openSettings()">تنظیمات و تم</button>
    </div>
  </div>
</div>

<div id="app" class="hidden min-h-dvh max-w-3xl mx-auto flex flex-col p-3 gap-2">
  <header class="glass px-3 py-2.5 flex items-center justify-between gap-2 intro-pop">
    <div class="min-w-0">
      <div class="font-extrabold logo-shine text-lg">Lumera AI</div>
      <div class="text-[10px] truncate" style="color:var(--muted)">سلام <b id="display-name"></b> · <span id="role" class="badge"></span> · <span id="persona-label">خودمونی</span></div>
    </div>
    <div class="flex gap-1 shrink-0">
      <button class="btn btn-ghost text-[10px]" onclick="toggleFocus()">تمرکز</button>
      <button class="btn btn-ghost text-[10px]" onclick="openSettings()">تنظیمات</button>
      <button class="btn btn-ghost text-[10px]" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="glass px-3 py-2 space-y-1">
    <div class="flex justify-between text-[10px]" style="color:var(--muted)"><span>مصرف امروز</span><span id="word-label">0</span></div>
    <div class="wordbar"><i id="word-bar"></i></div>
    <div class="flex justify-between text-[10px]" style="color:var(--muted)"><span id="mission-line">مأموریت</span><span id="score-line">امتیاز: 0</span></div>
  </div>

  <div id="thread-bar" class="flex gap-1 overflow-x-auto px-1"></div>

  <div class="tool-grid glass p-2">
    <button class="btn btn-ghost" onclick="runTool('caption')">کپشن</button>
    <button class="btn btn-ghost" onclick="runTool('rewrite')">بازنویس</button>
    <button class="btn btn-ghost" onclick="runTool('story')">استوری</button>
    <button class="btn btn-ghost" onclick="runTool('summary')">خلاصه</button>
    <button class="btn btn-ghost" onclick="runTool('ideas')">ایده</button>
    <button class="btn btn-ghost" onclick="runTool('plan')">برنامه</button>
    <button class="btn btn-ghost" onclick="runTool('translate')">ترجمه</button>
    <button class="btn btn-ghost" onclick="runTool('interview')">مصاحبه</button>
    <button class="btn btn-ghost" onclick="runTool('checklist')">چک‌لیست</button>
    <button class="btn btn-ghost" onclick="runTool('duel')">دوئل</button>
    <button class="btn btn-ghost" onclick="startBurst()">رگبار۶۰</button>
    <button class="btn btn-ghost" onclick="openAlbum()">آلبوم</button>
  </div>

  <main id="chat" class="glass flex-1 p-3 overflow-y-auto space-y-3" style="min-height:34vh;max-height:calc(100dvh - 380px)"></main>
  <div id="quick-chips" class="flex flex-wrap px-1"></div>
  <div id="file-preview" class="hidden px-1"></div>

  <div class="glass p-2.5 space-y-2">
    <div class="flex gap-2 items-end">
      <button class="btn btn-ghost" title="ویس" onclick="toggleVoice()">🎤</button>
      <label class="btn btn-ghost cursor-pointer" title="فایل / PDF / عکس / ویدیو">📎
        <input id="file-input" type="file" class="hidden" accept="image/*,video/*,application/pdf,text/plain,.pdf,.txt,.md,.csv,.json" onchange="onFilePick(event)"/>
      </label>
      <div id="wave"><span></span><span></span><span></span><span></span><span></span></div>
      <textarea id="prompt" class="input" rows="2" placeholder="پیام… یا فایل بکش اینجا" style="resize:none" onkeydown="onPromptKey(event)"></textarea>
      <button class="btn btn-primary" onclick="sendText()">ارسال</button>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost flex-1 text-[11px]" onclick="sendImage()">تصویر لومرا</button>
      <button class="btn btn-ghost flex-1 text-[11px]" onclick="clearChat()">پاک چت</button>
      <button class="btn btn-ghost flex-1 text-[11px]" onclick="exportChat()">خروجی</button>
    </div>
  </div>
</div>

<div id="settings-modal" class="modal" onclick="if(event.target===this)closeSettings()">
  <div class="glass w-full max-w-md p-4 space-y-3 max-h-[90dvh] overflow-y-auto" onclick="event.stopPropagation()">
    <h2 class="font-bold text-lg logo-shine">تنظیمات</h2>
    <div>
      <p class="text-xs mb-1" style="color:var(--muted)">شخصیت</p>
      <div class="flex flex-wrap gap-1" id="persona-chips"></div>
    </div>
    <div>
      <p class="text-xs mb-1" style="color:var(--muted)">حافظه شخصی</p>
      <textarea id="memory-box" class="input text-xs" rows="3" placeholder="هدف، رشته، سبک نوشتن..."></textarea>
      <button class="btn btn-primary w-full text-xs mt-1" onclick="saveMemory()">ذخیره حافظه</button>
    </div>
    <div>
      <p class="text-xs mb-1" style="color:var(--muted)">تم‌های خفن</p>
      <div class="grid grid-cols-3 gap-1">
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('space')">فضایی</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('cyber')">سایبر</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('neon')">نئون</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('aurora')">شفق</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('lava')">گدازه</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('violet')">بنفش</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('ocean')">اقیانوس</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('gold')">طلایی</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('sunset')">غروب</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('forest')">جنگل</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('ice')">یخی</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('midnight')">نیمه‌شب</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('dark')">تاریک</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('light')">روشن</button>
        <button class="btn btn-ghost text-[10px]" onclick="setTheme('rose')">رز</button>
      </div>
    </div>
    <button class="btn btn-ghost w-full text-xs" onclick="toggleAutoSpeak()">خواندن جواب: <b id="speak-flag">روشن</b></button>
    <button class="btn btn-ghost w-full text-xs" onclick="toggleTypewriter()">افکت تایپ: <b id="tw-flag">روشن</b></button>
    <div id="owner-key-box" class="hidden space-y-2 pt-2" style="border-top:1px solid var(--line)">
      <p class="text-xs font-bold">فقط مالک · OpenAI Key</p>
      <input id="openai-key" class="input" type="password" placeholder="sk-..."/>
      <button class="btn btn-primary w-full text-sm" onclick="saveOwnerKey()">ذخیره کلید</button>
    </div>
    <button class="btn btn-ghost w-full" onclick="closeSettings()">بستن</button>
  </div>
</div>

<div id="album-modal" class="modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="glass w-full max-w-md p-4" onclick="event.stopPropagation()">
    <h3 class="font-bold mb-2">آلبوم تصاویر</h3>
    <div id="album-box" class="flex flex-wrap gap-2"></div>
    <button class="btn btn-ghost w-full mt-3" onclick="$('album-modal').classList.remove('open')">بستن</button>
  </div>
</div>
</div>

function emailBotCheck(raw){
  const email=normEmail(raw);
  if(!email)return{ok:false,msg:'ایمیل را وارد کن'};
  if(!/^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/i.test(email))return{ok:false,msg:'ایمیل معتبر نیست'};
  const d=email.split('@')[1]||'';
  if(FAKE.some(x=>d===x||d.endsWith('.'+x)))return{ok:false,msg:'ایمیل موقت قبول نیست'};
  return{ok:true,msg:'ایمیل معتبر ✓',email};
}
function liveValidateEmail(){
  const r=emailBotCheck($('email').value);const h=$('email-hint');
  if(!String($('email').value||'').trim()){h.textContent='';return}
  h.textContent=r.msg;h.className=r.ok?'ok':'err';
}
function nameFromEmail(email){
  const local=normEmail(email).split('@')[0]||'کاربر';
  const map={amir:'امیر',ali:'علی',hesam:'حسام',reza:'رضا',mohammad:'محمد',sara:'سارا',nima:'نیما',far:'فر',milad:'میلاد',sina:'سینا'};
  let parts=local.split(/[._\-+]+/).filter(Boolean);if(!parts.length)parts=[local];
  if(parts.length===1&&parts[0].length>5){
    let rest=parts[0].toLowerCase(),built=[],keys=Object.keys(map).sort((a,b)=>b.length-a.length);
    while(rest.length){let hit=keys.find(k=>rest.startsWith(k));if(hit){built.push(map[hit]);rest=rest.slice(hit.length)}else{built.push(rest);break}}
    if(built.length>1)return built.join(' ');
  }
  return parts.map(p=>map[p.toLowerCase()]||(p[0]?p[0].toUpperCase()+p.slice(1):p)).join(' ');
}

function clearPendingFile(){
  pendingFile=null;
  const fp=$('file-preview');
  if(fp){fp.classList.add('hidden');fp.innerHTML=''}

function showPendingFile(){
  const fp=$('file-preview'); if(!fp||!pendingFile)return;
  let inner='📎 '+esc(pendingFile.name)+' <span style="opacity:.6">('+(Math.round(pendingFile.size/1024))+'KB)</span>';

  fp.innerHTML='<div class="file-chip">'+inner+' <button class="btn btn-ghost text-[10px]" onclick="clearPendingFile()">×</button></div>';

function readAsDataURL(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
}
function readAsText(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file)});
}
async function extractPdfText(file){
  if(!window.pdfjsLib) return '[PDF] کتابخانه PDF در دسترس نیست';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let text='';
  const max=Math.min(pdf.numPages,12);
  for(let i=1;i<=max;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    text+=content.items.map(it=>it.str).join(' ')+'\n';
  }
  if(pdf.numPages>max) text+='\n[... '+(pdf.numPages-max)+' صفحه دیگر خلاصه نشد]';
  return text.slice(0,14000);
}
async function videoFirstFrame(file){
  return new Promise((resolve)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.muted=true;v.playsInline=true;v.src=url;
    v.addEventListener('loadeddata',()=>{
      try{
        const c=document.createElement('canvas');
        c.width=Math.min(640,v.videoWidth||640);
        c.height=Math.min(360,v.videoHeight||360);
        const ctx=c.getContext('2d');
        ctx.drawImage(v,0,0,c.width,c.height);
        const data=c.toDataURL('image/jpeg',0.85);
        URL.revokeObjectURL(url);
        resolve(data);
      }catch(e){URL.revokeObjectURL(url);resolve(null)}
    });
    v.addEventListener('error',()=>{URL.revokeObjectURL(url);resolve(null)});
    setTimeout(()=>v.play().catch(()=>{}),100);
  });
}
async function processFile(file){
  if(!file)return;
  if(file.size>12*1024*1024){alert('حداکثر حدود ۱۲ مگابایت');return}
  const mime=file.type||'';
  const name=file.name||'file';
  pendingFile={name,mime,size:file.size,kind:'file'};
  try{
    if(mime.startsWith('image/')){
      pendingFile.kind='image';
      pendingFile.dataUrl=await readAsDataURL(file);
    }else if(mime==='application/pdf'||/\.pdf$/i.test(name)){
      pendingFile.kind='pdf';
      pendingFile.text=await extractPdfText(file);
    }else if(mime.startsWith('video/')){
      pendingFile.kind='video';
      pendingFile.dataUrl=await videoFirstFrame(file);
      pendingFile.text='ویدیو: '+name+' — فریم اول برای تحلیل بصری پیوست شد.';
    }else if(mime.startsWith('text/')||/\.(txt|md|csv|json|log)$/i.test(name)){
      pendingFile.kind='text';
      pendingFile.text=String(await readAsText(file)).slice(0,14000);
    }else{
      pendingFile.text='فایل پیوست شد: '+name+' (نوع '+mime+') — اگر متن‌خوان نیست فقط نامش را در نظر بگیر.';
    }
  }catch(e){
    pendingFile.text='خواندن فایل کامل نشد، ولی نامش: '+name;
  }
  showPendingFile();
}
function onFilePick(ev){
  const f=ev.target.files&&ev.target.files[0];
  if(f) processFile(f);
  ev.target.value='';
}
// drag & drop
(function(){
  let drag=0;
  window.addEventListener('dragenter',e=>{e.preventDefault();drag++;$('drop-overlay').classList.add('on')});
  window.addEventListener('dragleave',e=>{e.preventDefault();drag--;if(drag<=0){$('drop-overlay').classList.remove('on');drag=0}});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{
    e.preventDefault();drag=0;$('drop-overlay').classList.remove('on');
    const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) processFile(f);
  });
})();

async function callChat(text, imageDataUrl){
  if(!cachedOpenAIKey)await loadOpenAIKey();
  const name=(sessionUser&&sessionUser.displayName)||'کاربر';
  const messages=[{role:'system',content:systemPrompt()+' Call user: '+name}];
  if(imageDataUrl){
    messages.push({role:'user',content:[
      {type:'text',text:text||'این تصویر را تحلیل کن و خلاصه و نکات مهم را بگو.'},
      {type:'image_url',image_url:{url:imageDataUrl}}
    ]});
  }else{
    messages.push({role:'user',content:text});
  }
  // Edge
  try{
    const{data,error}=await sb.functions.invoke('lumera-ai',{body:{type:'chat',messages,model:imageDataUrl?'gpt-4o-mini':'gpt-4o-mini'}});
    if(!error&&data&&data.choices&&data.choices[0])return data.choices[0].message.content;
  }catch(e){}
  if(cachedOpenAIKey){
    try{
      const res=await fetch('https://api.openai.com/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cachedOpenAIKey},
        body:JSON.stringify({model:'gpt-4o-mini',messages})
      });
      const data=await res.json().catch(()=>({}));
      if(res.ok&&data.choices&&data.choices[0])return data.choices[0].message.content;
      if(data.error&&data.error.message) return 'خطا OpenAI: '+data.error.message;
    }catch(e){}
  }
  // fallback text only
  if(!imageDataUrl){
    try{
      const pr=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,model:'openai'})});
      if(pr.ok){const t=await pr.text();if(t&&t.trim())return t.trim()}
    }catch(e){}
  }
  return 'الان وصل نشدم. کلید OpenAI یا فیلترشکن را چک کن.';
}

async function callImage(prompt){
  const full=prompt+LUMERA_IMG_STYLE;
  if(!cachedOpenAIKey)await loadOpenAIKey();
  try{
    const{data}=await sb.functions.invoke('lumera-ai',{body:{type:'image',prompt:full}});
    if(data&&data.data&&data.data[0]&&data.data[0].url)return data.data[0].url;
  }catch(e){}
  if(cachedOpenAIKey){
    try{
      const res=await fetch('https://api.openai.com/v1/images/generations',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cachedOpenAIKey},body:JSON.stringify({model:'dall-e-3',prompt:full,size:'1024x1024',n:1})});
      const data=await res.json().catch(()=>({}));
      if(res.ok&&data.data&&data.data[0])return data.data[0].url;
    }catch(e){}
  }
  return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(full)+'?width=768&height=768&nologo=true&seed='+Date.now();
}

function addMsg(role,text,extraHtml,skipTw){
  const div=document.createElement('div');
  div.className='flex '+(role==='user'?'justify-start':'justify-end');
  const b=document.createElement('div');
  b.className='max-w-[92%] rounded-2xl px-3 py-2 text-sm whitespace-pre-wrap '+(role==='user'?'msg-user':'msg-ai');
  if(role==='ai'&&typewriterOn&&text&&text!=='...'&&!skipTw&&text.length<900){
    b.textContent='';div.appendChild(b);$('chat').appendChild(div);
    let i=0;const t=String(text);
    (function tick(){i+=2;b.textContent=t.slice(0,i);$('chat').scrollTop=$('chat').scrollHeight;if(i<t.length)setTimeout(tick,10);else afterAiBubble(b,t,extraHtml)})();
  }else{
    b.innerHTML=esc(text)+(extraHtml||'');
    if(role==='ai'&&text&&text!=='...') afterAiBubble(b,text,null);
    div.appendChild(b);$('chat').appendChild(div);
  }
  $('chat').scrollTop=$('chat').scrollHeight;
  if(role==='ai'&&text&&text!=='...') lastAiText=text;
}
function afterAiBubble(b,text,extraHtml){
  if(extraHtml) b.innerHTML=esc(text)+extraHtml;
  const row=document.createElement('div');row.className='act-row';
  [['ادامه','continue'],['کوتاه‌تر','shorter'],['مثال','example'],['کپی','copy'],['اشتراک','share']].forEach(([lab,act])=>{
    const bt=document.createElement('button');bt.textContent=lab;bt.onclick=()=>handleAct(act,text);row.appendChild(bt);
  });
  b.appendChild(row);
}
function handleAct(act,text){
  if(act==='copy'){try{navigator.clipboard.writeText(text)}catch(e){}return}
  if(act==='share'){addMsg('ai','کارت:', '<div class="mt-2 p-3 rounded-xl" style="background:linear-gradient(145deg,#0f172a,#1e1b4b);border:1px solid rgba(34,211,238,.3)"><b>Lumera AI</b><div class="text-xs mt-1 whitespace-pre-wrap">'+esc(text.slice(0,350))+'</div></div>',true);return}
  if(act==='continue'){$('prompt').value='ادامه بده';sendText();return}
  if(act==='shorter'){$('prompt').value='کوتاه‌تر:\n'+text;sendText();return}
  if(act==='example'){$('prompt').value='مثال ملموس برای:\n'+text;sendText();return}
}
function speak(text){try{if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).slice(0,400));u.lang='fa-IR';speechSynthesis.speak(u)}catch(e){}}

async function sendText(){
  let t=$('prompt').value.trim();
  const file=pendingFile;
  if(!t&&!file)return;
  if(!isOwner){
    const w=countWords(t)+(file&&file.text?countWords(file.text.slice(0,500)):0);
    if(wordsUsed()+w>WORD_LIMIT){addMsg('ai','سقف کلمات امروز پر شد.');return}
    addWords(Math.max(1,w));
  }
  $('prompt').value='';
  let userShow=t||('تحلیل فایل: '+(file&&file.name));
  let extra='';
  if(file&&file.kind==='image'&&file.dataUrl) extra='<div class="mt-2"><img src="'+file.dataUrl+'" style="max-width:180px;border-radius:12px"/></div>';
  if(file&&file.kind==='pdf') userShow+=(t?'\n':'')+'[PDF: '+file.name+']';
  if(file&&file.kind==='video') userShow+=(t?'\n':'')+'[ویدیو: '+file.name+']';
  addMsg('user',userShow,extra,true);
  addMsg('ai','...');
  const nodes=$('chat').querySelectorAll('.msg-ai');const last=nodes[nodes.length-1];
  try{
    let prompt=t||'این فایل را بررسی کن و خلاصه و نکات مهم را بگو.';
    let img=null;
    if(file){
      if(file.kind==='image') img=file.dataUrl;
      else if(file.kind==='video'&&file.dataUrl){img=file.dataUrl;prompt+='\n(فریم اول ویدیو پیوست است)\n'+ (file.text||'')}
      else if(file.text) prompt+='\n\n--- محتوای فایل ('+file.name+') ---\n'+file.text;
    }
    const ans=await callChat(prompt,img);
    last.parentElement.remove();
    addMsg('ai',ans);
    if(autoSpeak)speak(ans);
    if(!isOwner)addWords(countWords(ans));
    clearPendingFile();
    if(localStorage.getItem(missionKey()+'_done')!=='1'&&countWords(ans)>15){
      localStorage.setItem(missionKey()+'_done','1');addScore(5);$('mission-line').textContent='مأموریت: انجام شد ✓';
    }
  }catch(e){last.parentElement.remove();addMsg('ai','خطا: '+(e.message||e));}
}

function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('ai','ویس پشتیبانی نمی‌شود');return}
  if(voiceRec){try{voiceRec.stop()}catch(e){}voiceRec=null;$('wave').classList.remove('on');return}
  voiceRec=new SR();voiceRec.lang='fa-IR';$('wave').classList.add('on');
  voiceRec.onresult=ev=>{$('prompt').value=ev.results[0][0].transcript;$('wave').classList.remove('on');sendText();voiceRec=null};
  voiceRec.onerror=()=>{voiceRec=null;$('wave').classList.remove('on')};
  voiceRec.onend=()=>{voiceRec=null;$('wave').classList.remove('on')};
  voiceRec.start();addMsg('ai','گوش می‌دهم...',null,true);
}

  $('auth').classList.add('hidden');$('app').classList.remove('hidden');
  isOwner=isOwnerEmail(sessionUser&&sessionUser.email);
  if(sessionUser){sessionUser.owner=isOwner;if(!sessionUser.displayName)sessionUser.displayName=nameFromEmail(sessionUser.email);localStorage.setItem('lumera_ai_user',JSON.stringify(sessionUser))}
  $('display-name').textContent=sessionUser.displayName||'';
  $('role').textContent=isOwner?'مالک':'کاربر';$('role').className='badge'+(isOwner?' owner':'');
  $('persona-label').textContent=PERSONA_NAMES[persona]||persona;
  await loadOpenAIKey();refreshWordUI();renderQuick();loadThreads();renderThreads();
  $('mission-line').textContent='مأموریت: '+(localStorage.getItem(missionKey()+'_done')==='1'?'انجام شد ✓':todayMission());
  $('score-line').textContent='امتیاز: '+getScore();
  if(!soft&&!$('chat').dataset.ready){
    $('chat').dataset.ready='1';
    addMsg('ai','سلام '+(sessionUser.displayName||'')+' ✨\nمن Lumera AI هستم.\nمتن، ویس، عکس، PDF و ویدیو بفرست — آماده‌ام.',null,true);
  }
}
function logout(){saveThread();localStorage.removeItem('lumera_ai_user');location.reload()}

(function boot(){
  const t=localStorage.getItem('lumera_ai_theme'); if(t) setTheme(t);
  try{const saved=localStorage.getItem('lumera_ai_user');if(saved){sessionUser=JSON.parse(saved);isOwner=isOwnerEmail(sessionUser.email);enterApp()}}catch(e){}
})();
</script>
