<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
:root, [data-theme="space"]{
  --bg:#050814; --card:rgba(15,23,42,.82); --line:rgba(148,163,184,.22);
  --text:#e8eefc; --muted:#94a3b8; --a:#22d3ee; --b:#a78bfa;
}
[data-theme="dark"]{
  --bg:#0a0a0a; --card:rgba(24,24,24,.92); --line:rgba(255,255,255,.12);
  --text:#f5f5f5; --muted:#a3a3a3; --a:#60a5fa; --b:#818cf8;
}
[data-theme="light"]{
  --bg:#eef2ff; --card:rgba(255,255,255,.94); --line:rgba(15,23,42,.12);
  --text:#0f172a; --muted:#64748b; --a:#0891b2; --b:#7c3aed;
}
[data-theme="sunset"]{
  --bg:#1a0b0b; --card:rgba(40,15,15,.9); --line:rgba(251,146,60,.22);
  --text:#fff7ed; --muted:#fdba74; --a:#fb923c; --b:#f43f5e;
}
[data-theme="ocean"]{
  --bg:#021526; --card:rgba(3,40,60,.9); --line:rgba(34,211,238,.22);
  --text:#e0f7ff; --muted:#7dd3fc; --a:#06b6d4; --b:#3b82f6;
}
[data-theme="neon"]{
  --bg:#0a0014; --card:rgba(30,0,50,.92); --line:rgba(236,72,153,.25);
  --text:#fdf4ff; --muted:#e879f9; --a:#f472b6; --b:#22d3ee;
}
[data-theme="forest"]{
  --bg:#05140a; --card:rgba(10,40,20,.92); --line:rgba(74,222,128,.22);
  --text:#ecfdf5; --muted:#86efac; --a:#4ade80; --b:#14b8a6;
}
[data-theme="gold"]{
  --bg:#1a1408; --card:rgba(40,30,10,.92); --line:rgba(251,191,36,.25);
  --text:#fffbeb; --muted:#fcd34d; --a:#fbbf24; --b:#f97316;
}
[data-theme="ice"]{
  --bg:#0b1220; --card:rgba(15,30,50,.92); --line:rgba(147,197,253,.25);
  --text:#eff6ff; --muted:#93c5fd; --a:#60a5fa; --b:#a5b4fc;
}
[data-theme="rose"]{
  --bg:#1a0a12; --card:rgba(40,15,30,.92); --line:rgba(251,113,133,.22);
  --text:#fff1f2; --muted:#fda4af; --a:#fb7185; --b:#e879f9;

[data-theme="midnight"]{
  --bg:#020617; --card:rgba(15,23,42,.95); --line:rgba(99,102,241,.25);
  --text:#e2e8f0; --muted:#94a3b8; --a:#818cf8; --b:#c084fc;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  font-family:Vazirmatn,system-ui,sans-serif;
  color:var(--text);
  background-color:var(--bg);
  min-height:100dvh;
  position:relative;
  overflow-x:hidden;
}
/* لایه پس‌زمینه ثابت — خراب نمی‌شود */
#bg-layer{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 500px at 12% -8%, color-mix(in srgb, var(--a) 28%, transparent), transparent 55%),
    radial-gradient(700px 420px at 100% 8%, color-mix(in srgb, var(--b) 22%, transparent), transparent 50%),
    radial-gradient(600px 400px at 50% 110%, color-mix(in srgb, var(--a) 10%, transparent), transparent 45%),
    var(--bg);
}
#bg-stars{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.45;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,.7), transparent),
    radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 55% 35%, rgba(255,255,255,.65), transparent),
    radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,.45), transparent),
    radial-gradient(1.5px 1.5px at 88% 60%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 20% 50%, rgba(255,255,255,.35), transparent);
  background-size:100% 100%;
}
#app-root{position:relative;z-index:1;min-height:100dvh}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.btn{border:0;border-radius:14px;padding:.8rem 1rem;font-weight:700;cursor:pointer;color:var(--text);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--a),var(--b));color:#041018}
.btn-ghost{background:color-mix(in srgb,var(--text) 8%, transparent)}
.input{width:100%;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%, transparent);color:var(--text);padding:.85rem 1rem;outline:none}
.input:focus{border-color:color-mix(in srgb,var(--a) 55%, var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 15%, transparent)}
.msg-user{background:color-mix(in srgb,var(--a) 18%, transparent)}
.msg-ai{background:color-mix(in srgb,var(--bg) 70%, transparent);border:1px solid var(--line)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--a)}
.badge.owner{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1917}
.hidden{display:none!important}
#settings-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
#settings-modal.open{display:flex}
#fab{position:fixed;bottom:20px;left:20px;z-index:90;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#041018;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.err{color:#fca5a5;font-size:12px;min-height:18px}
.ok{color:#6ee7b7;font-size:12px}
.chip{display:inline-block;padding:6px 10px;border-radius:999px;font-size:11px;margin:3px;cursor:pointer;background:color-mix(in srgb,var(--text) 8%,transparent);border:1px solid var(--line)}
.wordbar{height:4px;border-radius:99px;background:color-mix(in srgb,var(--text) 12%,transparent);overflow:hidden}
.wordbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.copy-btn{font-size:10px;opacity:.6;cursor:pointer;margin-top:4px}
.copy-btn:hover{opacity:1}
</style>

const FAKE_DOMAINS = ['mailinator.com','tempmail.com','10minutemail.com','guerrillamail.com','trashmail.com','yopmail.com','temp-mail.org','fakeinbox.com','sharklasers.com','getnada.com'];
const KNOWN_OK = ['gmail.com','googlemail.com','yahoo.com','outlook.com','hotmail.com','live.com','icloud.com','me.com','proton.me','protonmail.com','aol.com','mail.com','zoho.com','yandex.com','mail.ru','gmx.com'];

  'به زبان ساده‌تر توضیح بده',

  'یک کپشن اینستاگرام بنویس'
];

function $(id){ return document.getElementById(id); }
function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function isOwnerEmail(email){
  const e = normEmail(email);
  return e === OWNER_EMAIL || e === 'amiralihesam@gmail.com';
}

function emailBotCheck(raw){
  const email = normEmail(raw);
  if(!email) return { ok:false, msg:'ایمیل را وارد کن' };
  if(email.length > 254) return { ok:false, msg:'ایمیل خیلی بلند است' };
  if(email.indexOf(' ') >= 0) return { ok:false, msg:'فاصله در ایمیل مجاز نیست' };
  const re = /^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/i;
  if(!re.test(email)) return { ok:false, msg:'این یک ایمیل واقعی نیست' };
  const parts = email.split('@');
  if(parts.length !== 2) return { ok:false, msg:'فرمت ایمیل اشتباه است' };
  const local = parts[0], domain = parts[1];
  if(!local) return { ok:false, msg:'قبل از @ چیزی نیست' };
  if(local.startsWith('.') || local.endsWith('.') || local.includes('..')) return { ok:false, msg:'نقطه‌گذاری نامعتبر' };
  if(!domain.includes('.')) return { ok:false, msg:'دامنه ناقص است' };
  const tld = domain.split('.').pop();
  if(!tld || tld.length < 2) return { ok:false, msg:'پسوند دامنه کوتاه است' };
  if(FAKE_DOMAINS.some(d => domain === d || domain.endsWith('.'+d))) return { ok:false, msg:'ایمیل موقت قبول نیست' };
  const known = KNOWN_OK.some(d => domain === d || domain.endsWith('.'+d));
  return { ok:true, msg: known ? 'ایمیل معتبر است ✓' : 'فرمت درست است ✓', email, local, domain };
}

function liveValidateEmail(){
  const r = emailBotCheck($('email').value);
  const hint = $('email-hint');
  if(!String($('email').value||'').trim()){ hint.textContent=''; hint.className='err'; return; }
  if(r.ok){ hint.textContent = r.msg; hint.className='ok'; }
  else { hint.textContent = r.msg; hint.className='err'; }
}

function nameFromEmail(email){
  const local = normEmail(email).split('@')[0] || 'کاربر';
  let parts = local.split(/[._\-+]+/).filter(Boolean);
  if(!parts.length) parts = [local];
  const map = {
    amir:'امیر', ali:'علی', hesam:'حسام', hossein:'حسین', hassan:'حسن',
    reza:'رضا', mohammad:'محمد', mahdi:'مهدی', mehdi:'مهدی', sara:'سارا',
    fateme:'فاطمه', fatemeh:'فاطمه', zahra:'زهرا', maryam:'مریم',
    nima:'نیما', arya:'آریا', pouya:'پویا', far:'فر', farhad:'فرهاد',
    milad:'میلاد', sina:'سینا', kian:'کیان', aria:'آریا', shahin:'شاهین'
  };
  const out = parts.map(p => {
    const k = p.toLowerCase().replace(/\d+/g,'');
    if(map[k]) return map[k];
    if(/^[a-zA-Z]+$/.test(p)) return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
    return p;
  });
  if(out.length === 1 && parts[0] && parts[0].length > 6){
    const s = parts[0].toLowerCase();
    const keys = Object.keys(map).sort((a,b)=>b.length-a.length);
    let rest = s, built = [];
    while(rest.length){
      let hit = null;
      for(const k of keys){ if(rest.startsWith(k)){ hit=k; break; } }
      if(hit){ built.push(map[hit]); rest = rest.slice(hit.length); }
      else { built.push(rest); break; }
    }
    if(built.length > 1) return built.join(' ');
  }
  return out.join(' ');
}

function openSettings(){
  $('settings-modal').classList.add('open');
  const own = isOwner || (sessionUser && isOwnerEmail(sessionUser.email));
  $('owner-key-box').classList.toggle('hidden', !own);
  if(own){ $('openai-key').value = ''; $('openai-key').placeholder = cachedOpenAIKey ? 'کلید ذخیره شده — برای تغییر کلید جدید بزن' : 'sk-proj-...'; }
  $('speak-flag').textContent = autoSpeak ? 'روشن' : 'خاموش';
}
function closeSettings(){ $('settings-modal').classList.remove('open'); }
function setTheme(name){
  document.body.setAttribute('data-theme', name);
  localStorage.setItem('lumera_ai_theme', name);
}
(function(){ const t=localStorage.getItem('lumera_ai_theme'); if(t) setTheme(t); })();
function toggleAutoSpeak(){
  autoSpeak = !autoSpeak;
  localStorage.setItem('lumera_ai_speak', autoSpeak ? '1' : '0');
  $('speak-flag').textContent = autoSpeak ? 'روشن' : 'خاموش';
}

async function loadOpenAIKey(){
  cachedOpenAIKey = '';
  try{
    const { data, error } = await sb.from('lumera_ai_config').select('openai_key').eq('id', 1).maybeSingle();
    if(!error && data && data.openai_key && String(data.openai_key).indexOf('*') < 0 && String(data.openai_key).length > 20){
      cachedOpenAIKey = String(data.openai_key).replace(/\s+/g,'');
    }
  }catch(e){}
  if(!cachedOpenAIKey){
    const local = localStorage.getItem('lumera_openai_key');
    if(local && local.indexOf('*') < 0 && local.length > 20) cachedOpenAIKey = local.replace(/\s+/g,'');
  }
}

async function saveOwnerKey(){
  if(!(isOwner || (sessionUser && isOwnerEmail(sessionUser.email)))){ alert('فقط مالک'); return; }
  let key = ($('openai-key').value || '').trim();
  if(!key || key.indexOf('*') >= 0){
    alert('کلید قبلی حفظ شد. برای عوض کردن کلید کامل جدید را وارد کن.');
    closeSettings(); return;
  }
  if(!(key.startsWith('sk-') || key.startsWith('sk-proj-'))){
    alert('کلید باید با sk- شروع شود'); return;
  }
  key = key.replace(/\s+/g, '');
  cachedOpenAIKey = key;
  localStorage.setItem('lumera_openai_key', key);
  try{
    const { error } = await sb.from('lumera_ai_config').upsert({ id:1, openai_key:key, updated_at:new Date().toISOString() });
    if(error) throw error;
    alert('کلید ذخیره شد');
  }catch(e){
    alert('روی این دستگاه ذخیره شد. ' + (e.message||''));
  }
  closeSettings();
}

async function saveUserToDb(email, displayName, owner){
  try{
    await sb.from('lumera_ai_users').upsert({
      email: normEmail(email),
      display_name: displayName || nameFromEmail(email),
      is_owner: !!owner,
      last_seen: new Date().toISOString()
    }, { onConflict: 'email' });
  }catch(e){}
}

function wordKey(){
  const day = new Date().toISOString().slice(0,10);
  const em = (sessionUser && sessionUser.email) || 'guest';
  return 'lumera_ai_words_' + day + '_' + em;
}
function wordsUsed(){ return parseInt(localStorage.getItem(wordKey())||'0',10); }
function addWords(n){
  if(isOwner) return wordsUsed();
  const v = wordsUsed() + n;
  localStorage.setItem(wordKey(), String(v));
  refreshWordUI();
  return v;
}
function countWords(t){ return String(t||'').trim().split(/\s+/).filter(Boolean).length; }
function refreshWordUI(){
  const used = isOwner ? 0 : wordsUsed();
  const lim = isOwner ? '∞' : WORD_LIMIT;
  const label = $('word-label');
  const bar = $('word-bar');
  if(label) label.textContent = isOwner ? 'نامحدود (مالک)' : (used + ' / ' + WORD_LIMIT + ' کلمه');
  if(bar){
    const pct = isOwner ? 5 : Math.min(100, Math.round(used / WORD_LIMIT * 100));
    bar.style.width = pct + '%';
    bar.style.background = pct > 85 ? '#ef4444' : (pct > 60 ? '#f59e0b' : 'linear-gradient(90deg,var(--a),var(--b))');
  }
}

async function startAuth(){
  const r = emailBotCheck($('email').value);
  liveValidateEmail();
  if(!r.ok) return;
  const email = r.email;
  const displayName = nameFromEmail(email);
  sessionUser = { email, displayName, owner: isOwnerEmail(email) };
  isOwner = sessionUser.owner;
  localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
  try{ await saveUserToDb(email, displayName, isOwner); }catch(e){}
  await enterApp();
}

function renderQuick(){
  const box = $('quick-chips');
  if(!box) return;
  box.innerHTML = QUICK.map(function(q){
    return '<span class="chip" onclick="useChip(\'' + q.replace(/'/g,"\\'") + '\')">'+q+'</span>';
  }).join('');
}
function useChip(q){ $('prompt').value = q; $('prompt').focus(); }

async function enterApp(){
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  isOwner = isOwnerEmail(sessionUser && sessionUser.email);
  if(sessionUser){
    sessionUser.owner = isOwner;
    if(!sessionUser.displayName) sessionUser.displayName = nameFromEmail(sessionUser.email);
    localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
  }
  $('who').textContent = sessionUser.email;
  $('display-name').textContent = sessionUser.displayName || nameFromEmail(sessionUser.email);
  $('role').textContent = isOwner ? 'مالک' : 'کاربر';
  $('role').className = 'badge' + (isOwner ? ' owner' : '');
  await loadOpenAIKey();
  refreshWordUI();
  renderQuick();
  if(!$('chat').dataset.ready){
    $('chat').dataset.ready = '1';
    const n = sessionUser.displayName || nameFromEmail(sessionUser.email);
    addMsg('ai', 'سلام ' + n + '! من Lumera AI هستم.\nمتن بفرست، با ویس حرف بزن، یا تصویر بساز.');
  }
}

function logout(){
  localStorage.removeItem('lumera_ai_user');
  location.reload();
}

function addMsg(role, text, extraHtml){
  const div = document.createElement('div');
  div.className = 'flex ' + (role==='user' ? 'justify-start' : 'justify-end');
  const b = document.createElement('div');
  b.className = 'max-w-[90%] rounded-2xl px-3 py-2 text-sm whitespace-pre-wrap ' + (role==='user'?'msg-user':'msg-ai');
  b.innerHTML = escapeHtml(text) + (extraHtml||'');
  if(role==='ai' && text && text !== '...' && text.indexOf('ساخت تصویر') < 0){
    const c = document.createElement('div');
    c.className = 'copy-btn';
    c.textContent = 'کپی';
    c.onclick = function(){ try{ navigator.clipboard.writeText(text); c.textContent='کپی شد'; setTimeout(function(){c.textContent='کپی';},1200);}catch(e){} };
    b.appendChild(c);
  }
  div.appendChild(b);
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function onPromptKey(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
}

async function callChat(text){
  if(!cachedOpenAIKey) await loadOpenAIKey();
  const name = (sessionUser && sessionUser.displayName) || 'کاربر';
  const messages = [
    { role:'system', content: SYSTEM + ' The user prefers to be called: ' + name },
    { role:'user', content: text }
  ];

  try{
    const { data, error } = await sb.functions.invoke('lumera-ai', {
      body: { type:'chat', messages: messages, model:'gpt-4o-mini' }
    });
    if(!error && data){
      if(data.error === 'NO_KEY') throw new Error('NO_KEY');
      if(data.error && !data.choices) throw new Error(data.error.message || data.error);
      if(data.choices && data.choices[0] && data.choices[0].message){
        return data.choices[0].message.content;
      }
    }
  }catch(e){ console.log('edge', e); }

  if(cachedOpenAIKey){
    try{
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cachedOpenAIKey },
        body: JSON.stringify({ model:'gpt-4o-mini', messages:messages })
      });
      const data = await res.json().catch(function(){return {};});
      if(res.ok && data.choices && data.choices[0]) return data.choices[0].message.content;
    }catch(e){ console.log('direct', e); }
  }

  try{
    const pr = await fetch('https://text.pollinations.ai/', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages:messages, model:'openai' })
    });
    if(pr.ok){
      const t = await pr.text();
      if(t && t.trim()) return t.trim();
    }
  }catch(e){}

  return 'الان به سرویس AI وصل نشدم. کلید را در تنظیمات چک کن یا فیلترشکن را روشن کن.';
}

async function callImage(prompt){
  if(!cachedOpenAIKey) await loadOpenAIKey();
  try{
    const { data, error } = await sb.functions.invoke('lumera-ai', {
      body: { type:'image', prompt: prompt }
    });
    if(!error && data && data.data && data.data[0] && data.data[0].url) return data.data[0].url;
  }catch(e){}
  if(cachedOpenAIKey){
    try{
      const res = await fetch('https://api.openai.com/v1/images/generations', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cachedOpenAIKey },
        body: JSON.stringify({ model:'dall-e-3', prompt:prompt, size:'1024x1024', n:1 })
      });
      const data = await res.json().catch(function(){return {};});
      if(res.ok && data.data && data.data[0]) return data.data[0].url;
    }catch(e){}
  }
  return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=768&height=768&nologo=true&seed='+Date.now();
}

async function sendText(){
  const t = $('prompt').value.trim();
  if(!t) return;
  if(!isOwner){
    const w = countWords(t);
    if(wordsUsed() + w > WORD_LIMIT){
      addMsg('ai', 'سقف کلمات امروز پر شده. فردا دوباره بیا یا با مالک برای Plus هماهنگ کن.');
      return;
    }
    addWords(w);
  }
  $('prompt').value = '';
  addMsg('user', t);
  addMsg('ai', '...');
  const nodes = $('chat').querySelectorAll('.msg-ai');
  const last = nodes[nodes.length-1];
  try{
    const ans = await callChat(t);
    last.parentElement.remove();
    addMsg('ai', ans);
    if(autoSpeak) speak(ans);
    if(!isOwner) addWords(countWords(ans));
  }catch(e){
    last.parentElement.remove();
    addMsg('ai', 'خطا: ' + (e.message||e));
  }
}

async function sendImage(){
  const t = $('prompt').value.trim() || 'cinematic space landscape, detailed';
  addMsg('user', '[تصویر] ' + t);
  addMsg('ai', 'ساخت تصویر...');
  const nodes = $('chat').querySelectorAll('.msg-ai');
  const last = nodes[nodes.length-1];
  try{
    const url = await callImage(t);
    last.parentElement.remove();
    addMsg('ai', 'تصویر:', '<div class="mt-2"><img src="'+url+'" alt="ai" style="border-radius:14px;max-width:100%;max-height:360px;object-fit:cover"/></div>');
    $('prompt').value = '';
  }catch(e){
    last.parentElement.remove();
    addMsg('ai', 'خطا: ' + (e.message||e));
  }
}

function clearChat(){
  $('chat').innerHTML = '';
  $('chat').dataset.ready = '';
  enterApp();
}

function exportChat(){
  const nodes = $('chat').querySelectorAll('.msg-user, .msg-ai');
  let out = '';
  nodes.forEach(function(n){
    const role = n.classList.contains('msg-user') ? 'شما' : 'AI';
    out += role + ':\n' + n.innerText.replace(/\n?کپی$/,'') + '\n\n';
  });
  try{
    navigator.clipboard.writeText(out);
    addMsg('ai', 'گفتگو در کلیپ‌بورد کپی شد.');
  }catch(e){
    addMsg('ai', out.slice(0,500));
  }
}

function speak(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0,400));
    u.lang = 'fa-IR';
    speechSynthesis.speak(u);
  }catch(e){}
}

function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ addMsg('ai', 'ویس در این مرورگر پشتیبانی نمی‌شود'); return; }
  if(voiceRec){ try{ voiceRec.stop(); }catch(e){} voiceRec=null; return; }
  voiceRec = new SR();
  voiceRec.lang = 'fa-IR';
  voiceRec.onresult = function(ev){
    $('prompt').value = ev.results[0][0].transcript;
    sendText();
    voiceRec = null;
  };
  voiceRec.onerror = function(){ voiceRec=null; };
  voiceRec.onend = function(){ voiceRec=null; };
  voiceRec.start();
  addMsg('ai', 'گوش می‌دهم...');
}

(async function boot(){
  try{
    const saved = localStorage.getItem('lumera_ai_user');
    if(saved){
      sessionUser = JSON.parse(saved);
      if(!sessionUser.displayName && sessionUser.email) sessionUser.displayName = nameFromEmail(sessionUser.email);
      isOwner = isOwnerEmail(sessionUser.email);
      sessionUser.owner = isOwner;
      await enterApp();
    }
  }catch(e){}
})();
</script>
