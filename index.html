<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="robots" content="noindex,nofollow,noarchive"/>
<meta name="theme-color" content="#000000"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src * data: blob:; connect-src https: wss:; object-src 'none'; base-uri 'self'"/>
<title>Lumera Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--fg:#e8e8e8;--muted:#6b6b6b;--line:#1a1a1a;--blood:#8b0000;--danger:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#000;color:var(--fg);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(80,0,0,.4),transparent 55%),#000;min-height:100vh}
.hidden{display:none!important}

/* ===== HQ-style gate ===== */
#gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 80% 50% at 30% 35%,rgba(80,20,20,.4),transparent 55%),
    radial-gradient(ellipse 60% 40% at 70% 60%,rgba(40,0,0,.35),transparent 50%),
    linear-gradient(165deg,#0a0505 0%,#100808 40%,#050000 100%)}
.gate-box{width:min(340px,92vw);text-align:center}
.gate-title{font-size:13px;letter-spacing:.35em;color:rgba(248,113,113,.7);margin-bottom:6px;font-weight:700}
.gate-h{font-size:22px;font-weight:900;color:#f5e6e6;letter-spacing:.12em;text-shadow:0 0 32px rgba(139,0,0,.55);margin-bottom:18px}
.lamp-wrap{cursor:pointer;display:inline-block;margin-bottom:10px;transition:transform .2s}
.lamp-wrap:active{transform:scale(.96)}
.lamp-svg{width:120px;height:168px;filter:drop-shadow(0 0 18px rgba(139,0,0,.35))}
.lamp-svg .bulb{fill:#1a0a0a;stroke:#3a1515;stroke-width:2;transition:fill .4s,filter .4s}
.lamp-wrap.on .bulb{fill:#f87171;filter:url(#glow)}
.lamp-svg .shade{fill:#2a1010;stroke:#5c2020;stroke-width:1.5}
.lamp-svg .cord{stroke:#444;stroke-width:2}
.gate-hint{font-size:11px;color:var(--muted);margin-bottom:14px}
.gate-form{display:none;text-align:right;background:rgba(12,6,6,.92);border:1px solid #2a1212;border-radius:16px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.gate-form.on{display:block}
.gate-form label{display:block;font-size:10px;color:var(--muted);margin:8px 0 4px}
.gate-form input{width:100%;background:#0a0505;border:1px solid #2a1515;color:#eee;border-radius:10px;padding:11px 12px;font:inherit;outline:none}
.gate-form input:focus{border-color:#7f1d1d;box-shadow:0 0 0 3px rgba(139,0,0,.2)}
.gate-tabs{display:flex;gap:6px;margin-bottom:8px}
.gate-tabs button{flex:1;border:1px solid #2a1515;background:#120808;color:#aaa;border-radius:10px;padding:8px;font:inherit;font-size:12px;cursor:pointer}
.gate-tabs button.on{background:#1a0808;color:#fecaca;border-color:#5c2020}
.gate-err{color:var(--danger);font-size:11px;min-height:16px;margin-top:8px;text-align:center}
.btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn-main{width:100%;margin-top:12px;background:linear-gradient(135deg,#7f1d1d,#450a0a);color:#fff;box-shadow:0 8px 24px rgba(127,29,29,.35)}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:#120808;color:#ccc;border:1px solid #2a1515}
.btn-danger{background:#450a0a;color:#fecaca;border:1px solid #7f1d1d;font-size:11px;padding:6px 10px}

/* ===== app ===== */
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 48px}
header{text-align:center;padding:28px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:18px;position:relative}
header h1{font-size:1.5rem;letter-spacing:.28em;font-weight:900;text-shadow:0 0 24px rgba(139,0,0,.55)}
header p{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:.12em}
.card{border:1px solid var(--line);background:rgba(10,10,10,.92);border-radius:14px;padding:14px;margin-bottom:12px}
.meta{font-size:10px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.body{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.card img,.card video{width:100%;border-radius:10px;margin-top:10px;max-height:70vh;object-fit:contain;background:#0a0a0a;cursor:pointer}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px}
textarea,input.field{width:100%;background:#0a0a0a;border:1px solid #222;color:#eee;border-radius:12px;padding:12px;font:inherit;outline:none}
textarea:focus,input.field:focus{border-color:#5c1010;box-shadow:0 0 0 3px rgba(139,0,0,.15)}
.row{display:flex;gap:8px;margin-top:8px}
.row label.btn{flex:1;text-align:center}
.owner-banner{font-size:11px;color:#c4c4c4;border:1px dashed #3a1010;background:rgba(40,0,0,.35);border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.6}
.log-item{font-size:11px;color:#9a9a9a;border-bottom:1px solid #151515;padding:8px 0}
.log-item b{color:#ddd}
.foot{text-align:center;margin-top:22px;font-size:10px;color:#333;letter-spacing:.2em}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a0505;border:1px solid #5c1010;color:#eee;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
.toast.on{opacity:1}
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:12px}
.lightbox.on{display:flex}
.lightbox img,.lightbox video{max-width:100%;max-height:92vh;object-fit:contain;border-radius:8px}
.lightbox .x{position:absolute;top:12px;left:12px;width:40px;height:40px;border:0;border-radius:50%;background:#1a0505;color:#fff;font-size:20px;cursor:pointer}
.splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
.splash.go{opacity:0;pointer-events:none}
.splash h2{letter-spacing:.4em;font-size:1.4rem;text-shadow:0 0 30px rgba(139,0,0,.8)}
.top-actions{position:absolute;left:0;top:18px;display:flex;gap:6px}
.top-actions button{font-size:10px;padding:6px 10px}
</style>
</head>
<body>
<div class="splash" id="splash"><h2>LUMERA DARK</h2></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLB()">
  <button type="button" class="x" onclick="closeLB()">×</button>
  <div id="lb-inner"></div>
</div>

<!-- GATE: HQ-style lamp login -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-title">LUMERA DARK</div>
    <div class="gate-h">ورود امن</div>
    <div class="lamp-wrap" id="lamp" onclick="toggleLamp()">
      <svg class="lamp-svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <line class="cord" x1="100" y1="10" x2="100" y2="48"/>
        <path class="shade" d="M60 48 H140 L125 95 H75 Z"/>
        <ellipse class="bulb" cx="100" cy="130" rx="28" ry="36"/>
        <rect x="90" y="165" width="20" height="14" rx="3" fill="#1a1010" stroke="#3a2020"/>
      </svg>
    </div>
    <p class="gate-hint" id="gate-hint">برای ورود روی چراغ بزن</p>
    <div class="gate-form" id="gate-form">
      <div class="gate-tabs">
        <button type="button" class="on" id="tab-login" onclick="setTab('login')">ورود</button>
        <button type="button" id="tab-reg" onclick="setTab('reg')">ثبت‌نام</button>
      </div>
      <div id="form-login">
        <label>نام کاربری</label>
        <input id="l-user" autocomplete="username" maxlength="24"/>
        <label>رمز عبور</label>
        <input id="l-pass" type="password" autocomplete="current-password" maxlength="64"/>
      </div>
      <div id="form-reg" class="hidden">
        <label>نام نمایشی</label>
        <input id="r-name" maxlength="32"/>
        <label>نام کاربری (انگلیسی)</label>
        <input id="r-user" autocomplete="username" maxlength="24"/>
        <label>رمز عبور (حداقل ۸)</label>
        <input id="r-pass" type="password" autocomplete="new-password" maxlength="64"/>
      </div>
      <p class="gate-err" id="gate-err"></p>
      <button type="button" class="btn btn-main" id="btn-auth" onclick="doAuth()">ادامه</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="wrap">
    <header>
      <div class="top-actions">
        <button type="button" class="btn btn-ghost" onclick="logout()">خروج</button>
      </div>
      <h1>LUMERA DARK</h1>
      <p>فضای اطلاعیه · دسترسی محدود</p>
    </header>

    <div id="owner-panel" class="hidden">
      <div class="owner-banner">
        پنل مالک — فقط <b>hesam</b>. اطلاعیه‌ها برای همه اعضا دیده می‌شود.
      </div>
      <div class="card">
        <div class="meta"><span>انتشار اطلاعیه</span><span>مالک</span></div>
        <textarea id="p-body" rows="5" maxlength="4000" placeholder="متن اطلاعیه..."></textarea>
        <div class="row">
          <label class="btn btn-ghost">عکس<input type="file" accept="image/*" id="p-img" hidden/></label>
          <label class="btn btn-ghost">فیلم<input type="file" accept="video/*" id="p-vid" hidden/></label>
        </div>
        <div id="preview" style="margin-top:8px"></div>
        <button class="btn btn-main" type="button" id="btn-pub">انتشار</button>
      </div>
      <div class="card">
        <div class="meta"><span>۵ ورود آخر دستگاه‌ها</span><span>امنیت</span></div>
        <div id="device-log"><div class="empty" style="padding:12px">—</div></div>
      </div>
    </div>

    <div id="feed"><div class="empty">در حال بارگذاری...</div></div>
    <div class="foot">SECURE · DARK · SILENT</div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var SB_URL = 'https://xtyxorzyrzvzpwrtqnys.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0eXhvcnp5cnp2enB3cnRxbnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzkwMTUsImV4cCI6MjEwNTgxNTAxNX0.JaLT_49x517O5gtY9FrAJc3i5xFKjNy-CCyo7kML76I';
  var OWNER_NAME = 'hesam';
  var LS_USER = 'ld_user_v5';
  var sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  var user = null;
  var mediaData = null;
  var mode = 'login';
  var clientFp = '';
  var clientIp = '';
  var deviceInfo = '';
  var authLock = false;
  var lastPub = 0;

  function $(id){ return document.getElementById(id); }
  function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(function(){ el.classList.remove('on'); }, 2400); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function faTime(iso){ try{ return new Date(iso).toLocaleString('fa-IR'); }catch(e){ return iso||''; } }

  // lightweight hash (server stores only hash)
  function hash(s){
    s = String(s||'') + '|ld-v5-salt';
    var h1=2166136261, h2=1469598101;
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      h1 ^= c; h1 = Math.imul(h1, 16777619);
      h2 ^= c; h2 = Math.imul(h2, 1099511628211);
    }
    return ('00000000'+(h1>>>0).toString(16)).slice(-8) + ('00000000'+(h2>>>0).toString(16)).slice(-8);
  }

  function sanitizeText(s){
    s=String(s||'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
    if(s.length>4000) s=s.slice(0,4000);
    return s;
  }
  function isDangerous(t){
    t=String(t||'');
    if(/<\s*script|javascript:|onerror\s*=|onload\s*=|eval\s*\(|document\.cookie/i.test(t)) return true;
    if(/union\s+select|drop\s+table|insert\s+into/i.test(t)) return true;
    return false;
  }
  function validUsername(u){
    u=String(u||'').trim().toLowerCase();
    if(!/^[a-z][a-z0-9_]{2,19}$/.test(u)) return {ok:false,msg:'نام کاربری: حرف اول انگلیسی، ۳–۲۰ کاراکتر'};
    if(/(admin|root|hack|هک|نال|null)/i.test(u) && u!==OWNER_NAME) return {ok:false,msg:'این نام کاربری مجاز نیست'};
    return {ok:true,v:u};
  }
  function validDisplay(n){
    n=String(n||'').trim();
    if(n.length<2||n.length>32) return {ok:false,msg:'نام نمایشی ۲ تا ۳۲ کاراکتر'};
    if(/^[0-9_\W]+$/.test(n)) return {ok:false,msg:'نام نمایشی نامعتبر'};
    if(isDangerous(n)) return {ok:false,msg:'نام غیرمجاز'};
    return {ok:true,v:n};
  }
  function isOwnerUser(u){
    return String(u||'').toLowerCase()===OWNER_NAME;
  }

  async function collectMeta(){
    try{
      deviceInfo = navigator.userAgent||'';
      var seed = [navigator.userAgent, navigator.language, screen.width+'x'+screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone||''].join('|');
      clientFp = hash(seed).slice(0,20);
      try{
        var r = await fetch('https://api.ipify.org?format=json');
        var j = await r.json();
        clientIp = j.ip||'';
      }catch(e){ clientIp = ''; }
    }catch(e){}
  }

  async function isBanned(){
    try{
      if(clientFp){
        var a = await sb.from('ld_bans').select('id').eq('fingerprint', clientFp).limit(1);
        if(a.data && a.data.length) return true;
      }
      if(clientIp){
        var b = await sb.from('ld_bans').select('id').eq('ip', clientIp).limit(1);
        if(b.data && b.data.length) return true;
      }
    }catch(e){}
    return false;
  }

  function toggleLamp(){
    var lamp=$('lamp');
    lamp.classList.toggle('on');
    if(lamp.classList.contains('on')){
      $('gate-form').classList.add('on');
      $('gate-hint').textContent = 'هویت خود را وارد کنید';
    }else{
      $('gate-form').classList.remove('on');
      $('gate-hint').textContent = 'برای ورود روی چراغ بزن';
    }
  }
  function setTab(t){
    mode=t;
    $('tab-login').classList.toggle('on', t==='login');
    $('tab-reg').classList.toggle('on', t==='reg');
    $('form-login').classList.toggle('hidden', t!=='login');
    $('form-reg').classList.toggle('hidden', t!=='reg');
    $('gate-err').textContent='';
  }

  async function doAuth(){
    if(authLock) return;
    authLock=true;
    $('btn-auth').disabled=true;
    $('gate-err').textContent='';
    try{
      if(await isBanned()){ $('gate-err').textContent='دسترسی مسدود است'; return; }
      if(mode==='login') await doLogin();
      else await doRegister();
    }catch(e){
      $('gate-err').textContent='خطا: '+(e.message||'اتصال');
    }finally{
      authLock=false;
      $('btn-auth').disabled=false;
    }
  }

  async function doLogin(){
    var vu=validUsername($('l-user').value);
    if(!vu.ok){ $('gate-err').textContent=vu.msg; return; }
    var pass=$('l-pass').value||'';
    if(pass.length<4){ $('gate-err').textContent='رمز را وارد کن'; return; }
    // server verify
    var {data,error}=await sb.from('ld_users').select('*').eq('username', vu.v).maybeSingle();
    if(error) throw error;
    if(!data){ $('gate-err').textContent='کاربر یافت نشد'; return; }
    if(data.is_banned){ $('gate-err').textContent='حساب مسدود است'; return; }
    if(data.password_hash !== hash(pass)){ $('gate-err').textContent='رمز اشتباه است'; return; }
    // force owner flag only for hesam
    var owner = isOwnerUser(data.username);
    await sb.from('ld_users').update({
      is_owner: owner,
      last_login_at: new Date().toISOString(),
      last_ip: clientIp||null,
      fingerprint: clientFp||null,
      device_info: (deviceInfo||'').slice(0,240)
    }).eq('id', data.id);
    user = Object.assign({}, data, { is_owner: owner });
    localStorage.setItem(LS_USER, JSON.stringify({id:user.id, username:user.username, display_name:user.display_name, is_owner:owner, t:Date.now()}));
    await logVisit(owner?'owner':'member');
    enterApp();
  }

  async function doRegister(){
    var vn=validDisplay($('r-name').value);
    if(!vn.ok){ $('gate-err').textContent=vn.msg; return; }
    var vu=validUsername($('r-user').value);
    if(!vu.ok){ $('gate-err').textContent=vu.msg; return; }
    var pass=$('r-pass').value||'';
    if(pass.length<8){ $('gate-err').textContent='رمز حداقل ۸ کاراکتر'; return; }
    if(isDangerous(pass)||isDangerous(vn.v)||isDangerous(vu.v)){ $('gate-err').textContent='ورودی غیرمجاز'; return; }

    // duplicate username — server
    var exU = await sb.from('ld_users').select('id').eq('username', vu.v).maybeSingle();
    if(exU.data){ $('gate-err').textContent='نام کاربری تکراری است'; return; }
    // duplicate display name
    var exN = await sb.from('ld_users').select('id').ilike('display_name', vn.v).maybeSingle();
    if(exN.data){ $('gate-err').textContent='این نام نمایشی قبلاً ثبت شده'; return; }

    var owner = isOwnerUser(vu.v);
    // only hesam can be owner; if hesam already exists block
    if(owner){
      var oEx = await sb.from('ld_users').select('id').eq('username', OWNER_NAME).maybeSingle();
      if(oEx.data){ $('gate-err').textContent='مالک از قبل ثبت شده'; return; }
    }

    var row = {
      username: vu.v,
      display_name: vn.v,
      password_hash: hash(pass),
      is_owner: owner,
      is_banned: false,
      fingerprint: clientFp||null,
      last_ip: clientIp||null,
      device_info: (deviceInfo||'').slice(0,240),
      last_login_at: new Date().toISOString()
    };
    var {data,error}=await sb.from('ld_users').insert(row).select().maybeSingle();
    if(error){
      if(String(error.message||'').indexOf('duplicate')>=0 || error.code==='23505'){
        $('gate-err').textContent='نام کاربری یا نام تکراری است';
        return;
      }
      throw error;
    }
    user = data;
    localStorage.setItem(LS_USER, JSON.stringify({id:user.id, username:user.username, display_name:user.display_name, is_owner:!!user.is_owner, t:Date.now()}));
    await logVisit(owner?'owner':'member');
    enterApp();
  }

  async function logVisit(role){
    try{
      await sb.from('ld_visits').insert({
        username: user?user.username:null,
        ip: clientIp||null,
        device: (deviceInfo||'').slice(0,180),
        ua: (navigator.userAgent||'').slice(0,180),
        screen: (screen.width||'')+'x'+(screen.height||''),
        role: role||'visitor'
      });
    }catch(e){}
  }

  function logout(){
    user=null;
    localStorage.removeItem(LS_USER);
    $('app').classList.add('hidden');
    $('gate').classList.remove('hidden');
    $('lamp').classList.remove('on');
    $('gate-form').classList.remove('on');
    $('gate-hint').textContent='برای ورود روی چراغ بزن';
  }

  function enterApp(){
    $('gate').classList.add('hidden');
    $('app').classList.remove('hidden');
    var own = user && isOwnerUser(user.username);
    $('owner-panel').classList.toggle('hidden', !own);
    if(own){
      $('p-img').onchange=function(){ readFile(this,'image'); };
      $('p-vid').onchange=function(){ readFile(this,'video'); };
      $('btn-pub').onclick=function(){ publish(); };
      loadDevices();
    }
    loadPosts();
  }

  function isSafeDataUrl(url, type){
    if(!url) return true;
    if(/^https:\/\//i.test(url)) return true;
    if(type==='image' && /^data:image\/(png|jpeg|jpg|gif|webp);base64,/i.test(url)) return true;
    if(type==='video' && /^data:video\/(mp4|webm|quicktime);base64,/i.test(url)) return true;
    return false;
  }
  function readFile(input, type){
    var f=input.files&&input.files[0]; if(!f) return;
    if(f.size>4.5*1024*1024){ toast('حداکثر حدود ۴٫۵ مگ'); input.value=''; return; }
    var r=new FileReader();
    r.onload=function(){
      var url=r.result;
      if(!isSafeDataUrl(url,type)){ toast('فرمت نامعتبر'); return; }
      mediaData={type:type,url:url};
      $('preview').innerHTML = type==='video'
        ? '<video src="'+url+'" controls style="max-width:100%;max-height:180px;border-radius:8px"></video>'
        : '<img src="'+url+'" style="max-width:100%;max-height:180px;border-radius:8px"/>';
    };
    r.readAsDataURL(f);
  }

  async function publish(){
    if(!user || !isOwnerUser(user.username)){ toast('فقط مالک'); return; }
    if(Date.now()-lastPub < 3000){ toast('کمی صبر کن'); return; }
    // re-verify ownership on server
    var chk = await sb.from('ld_users').select('username,is_banned').eq('id', user.id).maybeSingle();
    if(!chk.data || !isOwnerUser(chk.data.username) || chk.data.is_banned){ toast('دسترسی رد شد'); logout(); return; }

    var body = sanitizeText($('p-body').value);
    if(!body && !mediaData){ toast('متن یا رسانه لازم است'); return; }
    if(isDangerous(body)){ toast('محتوا مجاز نیست'); return; }
    var mt = mediaData?mediaData.type:'';
    var mu = mediaData?mediaData.url:'';
    if(mu && !isSafeDataUrl(mu, mt)){ toast('رسانه نامعتبر'); return; }
    if(mu && mu.length > 5500000){ toast('فایل خیلی بزرگ'); return; }

    var {error}=await sb.from('ld_posts').insert({
      body: body,
      media_type: mt||'',
      media_url: mu||'',
      author_username: user.username
    });
    if(error){ toast('خطا در انتشار'); return; }
    lastPub=Date.now();
    $('p-body').value=''; mediaData=null; $('preview').innerHTML='';
    $('p-img').value=''; $('p-vid').value='';
    toast('منتشر شد');
    loadPosts();
  }

  async function deletePost(id){
    if(!user || !isOwnerUser(user.username)){ toast('فقط مالک'); return; }
    if(!confirm('حذف این اطلاعیه؟')) return;
    var chk = await sb.from('ld_users').select('username').eq('id', user.id).maybeSingle();
    if(!chk.data || !isOwnerUser(chk.data.username)){ toast('رد شد'); return; }
    var {error}=await sb.from('ld_posts').delete().eq('id', id);
    if(error){ toast('حذف نشد'); return; }
    toast('حذف شد');
    loadPosts();
  }

  async function loadPosts(){
    var box=$('feed');
    try{
      var {data,error}=await sb.from('ld_posts').select('*').order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      if(!data||!data.length){ box.innerHTML='<div class="empty">اطلاعیه‌ای نیست</div>'; return; }
      var own = user && isOwnerUser(user.username);
      box.innerHTML = data.map(function(p){
        var media='';
        if(p.media_url && p.media_type==='image') media='<img src="'+esc(p.media_url)+'" alt="" onclick="openLB(this)"/>';
        if(p.media_url && p.media_type==='video') media='<video src="'+esc(p.media_url)+'" controls playsinline></video>';
        var del = own ? '<button type="button" class="btn btn-danger" onclick="deletePost('+p.id+')">حذف</button>' : '';
        return '<div class="card"><div class="meta"><span>اطلاعیه</span><span>'+esc(faTime(p.created_at))+' '+del+'</span></div><div class="body">'+esc(p.body)+'</div>'+media+'</div>';
      }).join('');
    }catch(e){
      box.innerHTML='<div class="empty" style="color:#f87171">خطا در بارگذاری — SQL را اجرا کن</div>';
    }
  }

  async function loadDevices(){
    var box=$('device-log');
    try{
      var {data}=await sb.from('ld_visits').select('*').order('created_at',{ascending:false}).limit(5);
      if(!data||!data.length){ box.innerHTML='<div class="empty" style="padding:12px">موردی نیست</div>'; return; }
      box.innerHTML = data.map(function(v){
        return '<div class="log-item"><b>'+esc(v.username||'—')+'</b> · '+esc(v.role||'')+'<br/>'+esc((v.device||'').slice(0,80))+'<br/>IP: '+esc(v.ip||'—')+' · '+esc(faTime(v.created_at))+'</div>';
      }).join('');
    }catch(e){ box.innerHTML='<div class="empty">—</div>'; }
  }

  function openLB(img){
    $('lb-inner').innerHTML='<img src="'+img.src+'" alt=""/>';
    $('lightbox').classList.add('on');
  }
  function closeLB(){ $('lightbox').classList.remove('on'); $('lb-inner').innerHTML=''; }
  window.openLB=openLB; window.closeLB=closeLB; window.deletePost=deletePost;
  window.toggleLamp=toggleLamp; window.setTab=setTab; window.doAuth=doAuth; window.logout=logout;

  async function boot(){
    await collectMeta();
    // restore session with server re-check
    try{
      var raw=localStorage.getItem(LS_USER);
      if(raw){
        var s=JSON.parse(raw);
        if(s && s.id && s.username){
          var {data}=await sb.from('ld_users').select('*').eq('id', s.id).maybeSingle();
          if(data && !data.is_banned && data.password_hash){
            // re-validate username match
            if(data.username===s.username){
              user=Object.assign({}, data, {is_owner: isOwnerUser(data.username)});
              await logVisit(user.is_owner?'owner':'member');
              enterApp();
            } else localStorage.removeItem(LS_USER);
          } else localStorage.removeItem(LS_USER);
        }
      }
    }catch(e){ localStorage.removeItem(LS_USER); }
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLB(); });
    setTimeout(function(){ $('splash').classList.add('go'); }, 700);
  }
  boot();
})();
</script>
</body>
