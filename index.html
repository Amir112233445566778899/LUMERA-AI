<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#000000"/>
<title>Lumera Dark</title>
<style>
  :root{
    --bg:#000; --fg:#e8e8e8; --muted:#6b6b6b; --line:#1a1a1a;
    --danger:#8B0000; --glow:#3f0000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#000;color:var(--fg);
    font-family:Vazirmatn,Tahoma,system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(80,0,0,.35), transparent 55%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(40,0,0,.25), transparent 50%),
      #000;
    min-height:100vh;
  }
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 48px}
  header{
    text-align:center;padding:28px 10px 18px;border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  header h1{
    font-size:1.6rem;letter-spacing:.28em;font-weight:900;
    color:#f5f5f5;text-shadow:0 0 24px rgba(139,0,0,.55);
  }
  header p{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:.12em}
  .card{
    border:1px solid var(--line);background:rgba(10,10,10,.92);
    border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 0 0 1px rgba(139,0,0,.08);
  }
  .card .meta{font-size:10px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
  .card .body{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .card img,.card video{width:100%;border-radius:10px;margin-top:10px;max-height:360px;object-fit:cover;background:#0a0a0a}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px}
  textarea,input{
    width:100%;background:#0a0a0a;border:1px solid #222;color:#eee;
    border-radius:12px;padding:12px;font:inherit;outline:none;
  }
  textarea:focus,input:focus{border-color:#5c1010;box-shadow:0 0 0 3px rgba(139,0,0,.15)}
  .btn{
    border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;
    cursor:pointer;width:100%;
  }
  .btn-main{background:linear-gradient(135deg,#4a0000,#1a0000);color:#f5f5f5;border:1px solid #5c1010}
  .btn-ghost{background:transparent;color:#aaa;border:1px solid #222;margin-top:8px}
  .row{display:flex;gap:8px;margin-top:8px}
  .row .btn{flex:1}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#1a0505;border:1px solid #5c1010;color:#eee;
    padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;
    pointer-events:none;transition:opacity .25s;z-index:50;
  }
  .toast.on{opacity:1}
  #view-public,#view-owner{display:none}
  #view-public.on,#view-owner.on{display:block}
  .owner-banner{
    font-size:11px;color:#c4c4c4;border:1px dashed #3a1010;background:rgba(40,0,0,.35);
    border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.6;
  }
  .log-item{font-size:11px;color:#9a9a9a;border-bottom:1px solid #151515;padding:8px 0}
  .log-item b{color:#ddd;font-weight:600}
  .foot{text-align:center;margin-top:22px;font-size:10px;color:#333;letter-spacing:.2em}
  .splash{
    position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;transition:opacity .6s;
  }
  .splash.go{opacity:0;pointer-events:none}
  .splash h2{
    letter-spacing:.4em;font-size:1.4rem;
    text-shadow:0 0 30px rgba(139,0,0,.8);
    animation:pulse 2s ease infinite;
  }
  @keyframes pulse{50%{opacity:.55}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="splash" id="splash"><h2>LUMERA DARK</h2></div>
<div class="toast" id="toast"></div>

<div class="wrap">
  <header>
    <h1>LUMERA DARK</h1>
    <p>فضای اطلاعیه · ناشناس</p>
  </header>

  <!-- صفحه عمومی -->
  <section id="view-public">
    <div id="feed" class="empty">هنوز اطلاعیه‌ای نیست</div>
    <div class="foot">ANONYMOUS · SILENT · DARK</div>
  </section>

  <!-- صفحه مالک (جدا) — بدون کلمه پنل/کد -->
  <section id="view-owner">
    <div class="owner-banner">
      این صفحه فقط برای تو باز شده. هویتت برای دیگران نمایش داده نمی‌شود.
      اطلاعیه‌ها برای همه به‌صورت ناشناس منتشر می‌شوند.
    </div>

    <div class="card">
      <div class="meta"><span>انتشار اطلاعیه</span><span id="owner-tag">ناشناس</span></div>
      <textarea id="p-body" rows="5" placeholder="متن اطلاعیه..."></textarea>
      <div class="row">
        <label class="btn btn-ghost" style="text-align:center">عکس
          <input type="file" accept="image/*" id="p-img" hidden/>
        </label>
        <label class="btn btn-ghost" style="text-align:center">فیلم
          <input type="file" accept="video/*" id="p-vid" hidden/>
        </label>
      </div>
      <div id="preview" style="margin-top:8px"></div>
      <button class="btn btn-main" style="margin-top:10px" id="btn-pub">انتشار ناشناس</button>
    </div>

    <div class="card">
      <div class="meta"><span>ورودها</span><span>IP · دستگاه · زمان</span></div>
      <div id="logs"><div class="empty" style="padding:16px">خالی</div></div>
    </div>

    <div class="card">
      <div class="meta"><span>اطلاعیه‌های منتشرشده</span><span></span></div>
      <div id="owner-feed"></div>
    </div>
  </section>
</div>

<script>
(function(){
  const LS_OWNER = 'ld_owner_token_v1';
  const LS_CLAIM = 'ld_owner_claimed_v1';
  const LS_POSTS = 'ld_posts_v1';
  const LS_LOGS  = 'ld_logs_v1';

  let mediaData = null; // {type, url}
  let isOwner = false;
  let ownerToken = localStorage.getItem(LS_OWNER) || '';

  const $ = (id)=>document.getElementById(id);
  function toast(t){
    const el=$('toast'); el.textContent=t; el.classList.add('on');
    setTimeout(()=>el.classList.remove('on'), 2200);
  }
  function uid(){ return 'p_'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
  function nowISO(){ return new Date().toISOString(); }
  function faTime(iso){
    try{ return new Date(iso).toLocaleString('fa-IR'); }catch(e){ return iso; }
  }
  function loadPosts(){
    try{ return JSON.parse(localStorage.getItem(LS_POSTS)||'[]'); }catch(e){ return []; }
  }
  function savePosts(arr){ localStorage.setItem(LS_POSTS, JSON.stringify(arr.slice(0,200))); }
  function loadLogs(){
    try{ return JSON.parse(localStorage.getItem(LS_LOGS)||'[]'); }catch(e){ return []; }
  }
  function saveLogs(arr){ localStorage.setItem(LS_LOGS, JSON.stringify(arr.slice(0,300))); }

  function deviceModel(){
    const ua = navigator.userAgent || '';
    // iOS
    if (/iPhone/.test(ua)) {
      // no exact model in UA anymore; keep useful signal
      const m = ua.match(/iPhone OS ([\d_]+)/);
      return 'iPhone'+(m?(' · iOS '+m[1].replace(/_/g,'.')):'');
    }
    if (/iPad/.test(ua)) return 'iPad';
    // Android often has model between parentheses
    const and = ua.match(/Android [^;]+; ([^)]+)\)/);
    if (and) return and[1].trim().replace(/ Build.*$/,'');
    if (/Android/.test(ua)) return 'Android device';
    if (/Windows/.test(ua)) return 'Windows';
    if (/Mac OS X/.test(ua)) return 'Mac';
    if (/Linux/.test(ua)) return 'Linux';
    return 'Unknown device';
  }

  async function fetchIP(){
    try{
      const r = await fetch('https://api.ipify.org?format=json', {cache:'no-store'});
      const j = await r.json();
      return j.ip || '—';
    }catch(e){
      return '—';
    }
  }

  async function claimOrCheckOwner(){
    const claimed = localStorage.getItem(LS_CLAIM);
    if (!claimed) {
      // first visitor on this browser/device becomes permanent owner for this storage realm
      ownerToken = 'ow_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
      localStorage.setItem(LS_CLAIM, '1');
      localStorage.setItem(LS_OWNER, ownerToken);
      isOwner = true;
      return;
    }
    // only the same token holder is owner
    const tok = localStorage.getItem(LS_OWNER);
    isOwner = !!(tok && tok === ownerToken && tok.length > 8);
    // if claim exists but this browser has the token
    if (tok && localStorage.getItem(LS_CLAIM)==='1') {
      ownerToken = tok;
      isOwner = true;
    } else {
      isOwner = false;
    }
  }

  async function logVisit(){
    const ip = await fetchIP();
    const entry = {
      t: nowISO(),
      ip: ip,
      device: deviceModel(),
      ua: (navigator.userAgent||'').slice(0,180),
      screen: (screen.width||'?')+'x'+(screen.height||'?')
    };
    const logs = loadLogs();
    logs.unshift(entry);
    saveLogs(logs);
  }

  function renderFeed(){
    const posts = loadPosts();
    const box = $('feed');
    if (!posts.length){
      box.className = 'empty';
      box.textContent = 'هنوز اطلاعیه‌ای نیست';
      return;
    }
    box.className = '';
    box.innerHTML = posts.map(p => cardHTML(p)).join('');
  }

  function renderOwnerFeed(){
    const posts = loadPosts();
    const box = $('owner-feed');
    if (!posts.length){ box.innerHTML = '<div class="empty" style="padding:12px">خالی</div>'; return; }
    box.innerHTML = posts.map(p => cardHTML(p)).join('');
  }

  function cardHTML(p){
    let media = '';
    if (p.media_type==='image' && p.media_url) media = '<img src="'+esc(p.media_url)+'" alt=""/>';
    if (p.media_type==='video' && p.media_url) media = '<video src="'+esc(p.media_url)+'" controls playsinline></video>';
    return '<article class="card"><div class="meta"><span>اطلاعیه</span><span>'+esc(faTime(p.created_at))+'</span></div><div class="body">'
      +esc(p.body||'')+'</div>'+media+'</article>';
  }

  function esc(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderLogs(){
    const logs = loadLogs();
    const box = $('logs');
    if (!logs.length){ box.innerHTML = '<div class="empty" style="padding:12px">خالی</div>'; return; }
    box.innerHTML = logs.map(l => (
      '<div class="log-item"><b>'+esc(faTime(l.t))+'</b><br/>IP: '+esc(l.ip)
      +'<br/>دستگاه: '+esc(l.device)
      +'<br/>صفحه: '+esc(l.screen)+'</div>'
    )).join('');
  }

  function showViews(){
    $('view-public').classList.toggle('on', !isOwner);
    $('view-owner').classList.toggle('on', !!isOwner);
    if (isOwner){
      renderOwnerFeed();
      renderLogs();
    } else {
      renderFeed();
    }
  }

  function bindMedia(){
    $('p-img').onchange = function(){ readFile(this, 'image'); };
    $('p-vid').onchange = function(){ readFile(this, 'video'); };
  }
  function readFile(input, type){
    const f = input.files && input.files[0];
    if (!f) return;
    if (f.size > 6*1024*1024){ toast('حداکثر حدود ۶ مگ'); input.value=''; return; }
    const r = new FileReader();
    r.onload = function(){
      mediaData = { type:type, url:r.result };
      const prev = $('preview');
      if (type==='image') prev.innerHTML = '<img src="'+r.result+'" style="width:100%;border-radius:10px;max-height:220px;object-fit:cover"/>';
      else prev.innerHTML = '<video src="'+r.result+'" controls playsinline style="width:100%;border-radius:10px;max-height:220px"></video>';
    };
    r.readAsDataURL(f);
  }

  function publish(){
    if (!isOwner) return;
    const body = ($('p-body').value||'').trim();
    if (!body && !mediaData){ toast('متن یا رسانه لازم است'); return; }
    // light safety: block obvious script injection in text display path (still escaped)
    if (/<\s*script/i.test(body)){ toast('محتوا مجاز نیست'); return; }
    const posts = loadPosts();
    posts.unshift({
      id: uid(),
      body: body,
      media_type: mediaData? mediaData.type : '',
      media_url: mediaData? mediaData.url : '',
      created_at: nowISO()
    });
    savePosts(posts);
    $('p-body').value = '';
    mediaData = null;
    $('preview').innerHTML = '';
    $('p-img').value = '';
    $('p-vid').value = '';
    toast('منتشر شد');
    renderOwnerFeed();
  }

  async function boot(){
    await claimOrCheckOwner();
    // log every visit (including owner)
    try{ await logVisit(); }catch(e){}
    showViews();
    bindMedia();
    $('btn-pub').onclick = publish;
    setTimeout(function(){ $('splash').classList.add('go'); }, 900);
  }
  boot();
})();
</script>
</body>
</html>
