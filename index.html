<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Lumera AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
:root, [data-theme="space"]{
  --bg:#050814; --card:rgba(15,23,42,.82); --line:rgba(148,163,184,.2);
  --text:#e8eefc; --muted:#94a3b8; --a:#22d3ee; --b:#a78bfa;
}
[data-theme="dark"]{
  --bg:#0a0a0a; --card:rgba(24,24,24,.9); --line:rgba(255,255,255,.12);
  --text:#f5f5f5; --muted:#a3a3a3; --a:#60a5fa; --b:#818cf8;
}
[data-theme="light"]{
  --bg:#f1f5f9; --card:rgba(255,255,255,.92); --line:rgba(15,23,42,.12);
  --text:#0f172a; --muted:#64748b; --a:#0891b2; --b:#7c3aed;
}
[data-theme="sunset"]{
  --bg:#1a0b0b; --card:rgba(40,15,15,.88); --line:rgba(251,146,60,.2);
  --text:#fff7ed; --muted:#fdba74; --a:#fb923c; --b:#f43f5e;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; font-family:Vazirmatn,system-ui,sans-serif;
  color:var(--text); background:var(--bg);
  background-image:radial-gradient(1000px 500px at 10% -10%, color-mix(in srgb, var(--a) 20%, transparent), transparent 55%);
}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(16px)}
.btn{border:0;border-radius:14px;padding:.8rem 1rem;font-weight:700;cursor:pointer;color:var(--text)}
.btn-primary{background:linear-gradient(135deg,var(--a),var(--b));color:#041018}
.btn-ghost{background:color-mix(in srgb,var(--text) 8%, transparent)}
.input{width:100%;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%, transparent);color:var(--text);padding:.85rem 1rem;outline:none}
.msg-user{background:color-mix(in srgb,var(--a) 18%, transparent)}
.msg-ai{background:color-mix(in srgb,var(--bg) 80%, transparent);border:1px solid var(--line)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--a)}
.badge.owner{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1917}
.hidden{display:none!important}
#settings-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
#settings-modal.open{display:flex}
#fab{position:fixed;bottom:20px;left:20px;z-index:90;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#041018;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style>
</head>
<body data-theme="space">

<button id="fab" type="button" onclick="openSettings()">تنظیمات</button>

<div id="auth" class="min-h-dvh flex items-center justify-center p-4">
  <div class="glass w-full max-w-md p-6 space-y-4">
    <div class="text-center">
      <div class="text-3xl font-extrabold" style="background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent">Lumera AI</div>
      <p class="text-sm mt-1" style="color:var(--muted)">هوش مصنوعی · ویس · تصویر</p>
    </div>
    <div id="step-email" class="space-y-3">
      <label class="text-xs" style="color:var(--muted)">ایمیل</label>
      <input id="email" class="input" type="email" placeholder="you@email.com"/>
      <button class="btn btn-primary w-full" onclick="startAuth()">ادامه</button>
      <button class="btn btn-ghost w-full" onclick="openSettings()">تنظیمات</button>
      <p class="text-[11px]" style="color:var(--muted)">کد به ایمیل می‌رود. مالک بدون کد وارد می‌شود.</p>
    </div>
    <div id="step-code" class="space-y-3 hidden">
      <p class="text-xs" style="color:var(--muted)">کد ارسال‌شده به <b id="email-show"></b></p>
      <input id="code" class="input" inputmode="numeric" placeholder="کد ۶ رقمی"/>
      <button class="btn btn-primary w-full" onclick="verifyCode()">ورود</button>
      <button class="btn btn-ghost w-full" onclick="backEmail()">بازگشت</button>
    </div>
    <p id="auth-err" class="text-xs text-center text-red-300 hidden"></p>
  </div>
</div>

<div id="app" class="hidden min-h-dvh max-w-3xl mx-auto flex flex-col p-3 gap-3">
  <header class="glass px-4 py-3 flex items-center justify-between">
    <div>
      <div class="font-extrabold text-lg">Lumera AI</div>
      <div class="text-[11px]" style="color:var(--muted)"><span id="who"></span> <span id="role" class="badge"></span></div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost text-xs" onclick="openSettings()">تنظیمات</button>
      <button class="btn btn-ghost text-xs" onclick="logout()">خروج</button>
    </div>
  </header>
  <main id="chat" class="glass flex-1 p-3 overflow-y-auto space-y-3" style="min-height:50vh;max-height:calc(100dvh - 200px)"></main>
  <div class="glass p-3 space-y-2">
    <div class="flex gap-2 items-end">
      <button class="btn btn-ghost" onclick="toggleVoice()">🎤</button>
      <textarea id="prompt" class="input" rows="2" placeholder="پیام به Lumera AI..." style="resize:none"></textarea>
      <button class="btn btn-primary" onclick="sendText()">ارسال</button>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost flex-1 text-xs" onclick="sendImage()">ساخت تصویر</button>
      <button class="btn btn-ghost flex-1 text-xs" onclick="clearChat()">پاک کردن</button>
    </div>
  </div>
</div>

<div id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <div class="glass w-full max-w-md p-5 space-y-3" onclick="event.stopPropagation()">
    <h2 class="font-bold text-lg">تنظیمات</h2>

    <div>
      <p class="text-xs mb-2" style="color:var(--muted)">تم</p>
      <div class="grid grid-cols-2 gap-2">
        <button class="btn btn-ghost text-xs" onclick="setTheme('space')">فضایی</button>
        <button class="btn btn-ghost text-xs" onclick="setTheme('dark')">تاریک</button>
        <button class="btn btn-ghost text-xs" onclick="setTheme('light')">روشن</button>
        <button class="btn btn-ghost text-xs" onclick="setTheme('sunset')">غروب</button>
      </div>
    </div>

    <div id="owner-key-box" class="hidden space-y-2 pt-2" style="border-top:1px solid var(--line)">
      <p class="text-xs font-bold">فقط مالک · OpenAI API Key</p>
      <input id="openai-key" class="input" type="password" placeholder="sk-..."/>
      <button class="btn btn-primary w-full text-sm" onclick="saveOwnerKey()">ذخیره کلید برای همه کاربران</button>
      <p class="text-[10px]" style="color:var(--muted)">کلید روی سرور Supabase ذخیره می‌شود تا بقیه هم AI واقعی داشته باشند.</p>
    </div>

    <button class="btn btn-ghost w-full" onclick="closeSettings()">بستن</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xtyxorzyrzvzpwrtqnys.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0eXhvcnp5cnp2enB3cnRxbnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzkwMTUsImV4cCI6MjEwNTgxNTAxNX0.JaLT_49x517O5gtY9FrAJc3i5xFKjNy-CCyo7kML76I';
const OWNER_EMAIL = 'amiralihesam@gmail.com';
const SYSTEM = 'You are Lumera AI, a sharp helpful assistant. Year is 2026. Reply in the user language (often Persian). Be natural, smart, and concise — not robotic.';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let sessionUser = null;
let isOwner = false;
let cachedOpenAIKey = '';
let voiceRec = null;

function $(id){ return document.getElementById(id); }
function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function isOwnerEmail(email){
  const e = normEmail(email);
  return e === OWNER_EMAIL || e === 'amiralihesamgmail.com';
}
function showErr(t){ const el=$('auth-err'); el.textContent=t||''; el.classList.toggle('hidden', !t); }

function openSettings(){
  const modal = $('settings-modal');
  modal.classList.add('open');
  const own = isOwner || (sessionUser && isOwnerEmail(sessionUser.email));
  $('owner-key-box').classList.toggle('hidden', !own);
  if(own) $('openai-key').value = cachedOpenAIKey ? '********' : '';
}
function closeSettings(){ $('settings-modal').classList.remove('open'); }

function setTheme(name){
  document.body.setAttribute('data-theme', name);
  localStorage.setItem('lumera_ai_theme', name);
}
(function(){ const t=localStorage.getItem('lumera_ai_theme'); if(t) setTheme(t); })();

async function loadOpenAIKey(){
  try{
    const { data, error } = await sb.from('lumera_ai_config').select('openai_key').eq('id', 1).maybeSingle();
    if(!error && data && data.openai_key){ cachedOpenAIKey = data.openai_key; }
  }catch(e){}
  // fallback local (owner device)
  if(!cachedOpenAIKey){
    const local = localStorage.getItem('lumera_openai_key');
    if(local) cachedOpenAIKey = local;
  }
}

async function saveOwnerKey(){
  if(!(isOwner || (sessionUser && isOwnerEmail(sessionUser.email)))){
    alert('فقط مالک'); return;
  }
  let key = $('openai-key').value.trim();
  if(key === '********'){ closeSettings(); return; }
  if(!key){ alert('کلید را وارد کن'); return; }
  cachedOpenAIKey = key;
  localStorage.setItem('lumera_openai_key', key);
  try{
    const { error } = await sb.from('lumera_ai_config').upsert({ id:1, openai_key:key, updated_at:new Date().toISOString() });
    if(error) throw error;
    alert('کلید ذخیره شد');
  }catch(e){
    alert('روی این دستگاه ذخیره شد. برای همه کاربران این SQL را در Supabase Run کن:\n\ncreate table if not exists lumera_ai_config (\n  id int primary key default 1,\n  openai_key text,\n  updated_at timestamptz default now()\n);\nalter table lumera_ai_config enable row level security;\ncreate policy \"read_config\" on lumera_ai_config for select using (true);\ncreate policy \"owner_write\" on lumera_ai_config for all using (true) with check (true);');
  }
  closeSettings();
}

async function startAuth(){
  showErr('');
  const email = normEmail($('email').value);
  if(!email || !email.includes('@')){ showErr('ایمیل معتبر لازم است'); return; }
  if(isOwnerEmail(email)){
    sessionUser = { email: OWNER_EMAIL, owner: true };
    isOwner = true;
    localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
    await enterApp();
    return;
  }
  try{
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error) throw error;
    $('email-show').textContent = email;
    $('step-email').classList.add('hidden');
    $('step-code').classList.remove('hidden');
  }catch(err){
    showErr(err.message || 'ارسال کد ناموفق');
  }
}

async function verifyCode(){
  showErr('');
  const email = normEmail($('email').value);
  const token = String($('code').value||'').trim();
  if(!token){ showErr('کد را وارد کن'); return; }
  try{
    const { data, error } = await sb.auth.verifyOtp({ email, token, type:'email' });
    if(error) throw error;
    sessionUser = { email, owner:false, id: data.user && data.user.id };
    isOwner = false;
    localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
    await enterApp();
  }catch(err){ showErr(err.message || 'کد اشتباه'); }
}

function backEmail(){ $('step-code').classList.add('hidden'); $('step-email').classList.remove('hidden'); showErr(''); }

async function enterApp(){
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = sessionUser.email;
  const own = isOwner || isOwnerEmail(sessionUser.email);
  isOwner = own;
  $('role').textContent = own ? 'مالک' : 'کاربر';
  $('role').className = 'badge' + (own ? ' owner' : '');
  await loadOpenAIKey();
  if(!$('chat').dataset.ready){
    $('chat').dataset.ready='1';
    addMsg('ai', 'سلام! من Lumera AI هستم.\nمتن، ویس یا ساخت تصویر.');
  }
}

function logout(){
  localStorage.removeItem('lumera_ai_user');
  try{ sb.auth.signOut(); }catch(e){}
  location.reload();
}

function addMsg(role, text, extraHtml){
  const div=document.createElement('div');
  div.className='flex '+(role==='user'?'justify-start':'justify-end');
  const b=document.createElement('div');
  b.className='max-w-[90%] rounded-2xl px-3 py-2 text-sm whitespace-pre-wrap '+(role==='user'?'msg-user':'msg-ai');
  b.innerHTML = escapeHtml(text) + (extraHtml||'');
  div.appendChild(b);
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function callChat(text){
  if(!cachedOpenAIKey){
    await loadOpenAIKey();
  }
  if(!cachedOpenAIKey){
    return 'کلید OpenAI هنوز توسط مالک تنظیم نشده.\nمالک باید از تنظیمات کلید را ذخیره کند.';
  }
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cachedOpenAIKey },
    body: JSON.stringify({
      model:'gpt-4o-mini',
      messages:[ {role:'system',content:SYSTEM}, {role:'user',content:text} ]
    })
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error&&data.error.message)||'OpenAI error');
  return data.choices[0].message.content;
}

async function callImage(prompt){
  if(!cachedOpenAIKey) await loadOpenAIKey();
  if(!cachedOpenAIKey){
    return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=768&height=768&nologo=true&seed='+Date.now();
  }
  const res = await fetch('https://api.openai.com/v1/images/generations', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cachedOpenAIKey },
    body: JSON.stringify({ model:'dall-e-3', prompt, size:'1024x1024', n:1 })
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error&&data.error.message)||'Image error');
  return data.data[0].url;
}

async function sendText(){
  const t=$('prompt').value.trim(); if(!t) return;
  $('prompt').value='';
  addMsg('user', t);
  addMsg('ai', '...');
  const nodes=$('chat').querySelectorAll('.msg-ai');
  const last=nodes[nodes.length-1];
  try{
    const ans=await callChat(t);
    last.parentElement.remove();
    addMsg('ai', ans);
    speak(ans);
  }catch(e){ last.parentElement.remove(); addMsg('ai','خطا: '+(e.message||e)); }
}

async function sendImage(){
  const t=$('prompt').value.trim()||'cinematic space art';
  addMsg('user','[تصویر] '+t);
  addMsg('ai','ساخت تصویر...');
  const nodes=$('chat').querySelectorAll('.msg-ai');
  const last=nodes[nodes.length-1];
  try{
    const url=await callImage(t);
    last.parentElement.remove();
    addMsg('ai','تصویر:', '<div class="mt-2"><img src="'+url+'" style="border-radius:14px;max-width:100%;max-height:360px;object-fit:cover"/></div>');
    $('prompt').value='';
  }catch(e){ last.parentElement.remove(); addMsg('ai','خطا: '+(e.message||e)); }
}

function clearChat(){ $('chat').innerHTML=''; $('chat').dataset.ready=''; enterApp(); }
function speak(text){ try{ if(!speechSynthesis)return; const u=new SpeechSynthesisUtterance(String(text).slice(0,400)); u.lang='fa-IR'; speechSynthesis.speak(u);}catch(e){} }
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ addMsg('ai','ویس پشتیبانی نمی‌شود'); return; }
  if(voiceRec){ try{voiceRec.stop()}catch(e){} voiceRec=null; return; }
  voiceRec=new SR(); voiceRec.lang='fa-IR';
  voiceRec.onresult=(ev)=>{ $('prompt').value=ev.results[0][0].transcript; sendText(); voiceRec=null; };
  voiceRec.onerror=()=>{ voiceRec=null; };
  voiceRec.onend=()=>{ voiceRec=null; };
  voiceRec.start(); addMsg('ai','گوش می‌دهم...');
}

(async function boot(){
  try{
    const saved=localStorage.getItem('lumera_ai_user');
    if(saved){
      sessionUser=JSON.parse(saved);
      isOwner=!!(sessionUser.owner||isOwnerEmail(sessionUser.email));
      await enterApp();
      return;
    }
  }catch(e){}
})();
</script>
</body>
</html>
