<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="robots" content="noindex"/>
<title>Lumera AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
  :root{
    --bg:#050814; --card:rgba(15,23,42,.72); --line:rgba(148,163,184,.18);
    --text:#e8eefc; --muted:#94a3b8; --a:#22d3ee; --b:#a78bfa;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; font-family:'Vazirmatn',system-ui,sans-serif;
    color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.18), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(167,139,250,.16), transparent 50%);
    background-attachment:fixed;
  }
  .glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:20px}
  .btn{border:none;border-radius:14px;padding:.75rem 1rem;font-weight:700;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--a),var(--b));color:#041018}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--text)}
  .input{width:100%;border-radius:14px;border:1px solid var(--line);background:rgba(2,6,23,.55);color:var(--text);padding:.85rem 1rem;outline:none}
  .input:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
  .msg-user{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.18))}
  .msg-ai{background:rgba(15,23,42,.9);border:1px solid var(--line)}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(34,211,238,.15);color:var(--a)}
  .owner{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1c1917}
  .hidden{display:none !important}
  #settings{align-items:center;justify-content:center}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<button id="fab-settings" type="button" onclick="openSettings()" style="position:fixed;bottom:18px;left:18px;z-index:60;border:none;border-radius:999px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#041018;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer">تنظیمات</button>
<div id="auth" class="min-h-dvh flex items-center justify-center p-4">
  <div class="glass w-full max-w-md p-6 space-y-4 fade">
    <div class="text-center space-y-1">
      <div class="text-3xl font-extrabold tracking-wide" style="background:linear-gradient(135deg,#67e8f9,#c4b5fd);-webkit-background-clip:text;color:transparent">Lumera AI</div>
      <p class="text-sm" style="color:var(--muted)">هوش مصنوعی · ویس · تصویر</p>
    </div>
    <div id="step-email" class="space-y-3">
      <label class="text-xs" style="color:var(--muted)">ایمیل</label>
      <input id="email" class="input" type="email" placeholder="you@email.com" autocomplete="email"/>
      <button class="btn btn-primary w-full" onclick="startAuth()">ادامه</button>
      <button id="auth-settings-btn" class="btn btn-ghost w-full" onclick="openSettings()">تنظیمات / API Key</button>
      <p class="text-[11px] leading-relaxed" style="color:var(--muted)">کد تأیید به ایمیل می‌رود. ایمیل مالک بدون کد وارد می‌شود.</p>
    </div>
    <div id="step-code" class="space-y-3 hidden">
      <p class="text-xs" style="color:var(--muted)">کد ارسال‌شده به <b id="email-show"></b></p>
      <input id="code" class="input" inputmode="numeric" placeholder="کد ۶ رقمی" maxlength="8"/>
      <button class="btn btn-primary w-full" onclick="verifyCode()">ورود</button>
      <button class="btn btn-ghost w-full" onclick="backEmail()">تغییر ایمیل</button>
    </div>
    <p id="auth-err" class="text-xs text-center text-red-300 hidden"></p>
  </div>
</div>

<div id="app" class="hidden min-h-dvh max-w-3xl mx-auto flex flex-col p-3 gap-3">
  <header class="glass px-4 py-3 flex items-center justify-between gap-2">
    <div>
      <div class="font-extrabold text-lg">Lumera AI</div>
      <div class="text-[11px]" style="color:var(--muted)"><span id="who"></span> <span id="role" class="badge"></span></div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost text-xs" onclick="openSettings()">تنظیمات</button>
      <button class="btn btn-ghost text-xs" onclick="logout()">خروج</button>
    </div>
  </header>
  <main id="chat" class="glass flex-1 p-3 overflow-y-auto space-y-3" style="min-height:55vh;max-height:calc(100dvh - 190px)"></main>
  <div class="glass p-3 space-y-2">
    <div class="flex gap-2 items-end">
      <button class="btn btn-ghost" title="ویس" onclick="toggleVoice()">🎤</button>
      <textarea id="prompt" class="input" rows="2" placeholder="پیام به Lumera AI..." style="resize:none"></textarea>
      <button class="btn btn-primary" onclick="sendText()">ارسال</button>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost flex-1 text-xs" onclick="sendImage()">ساخت تصویر</button>
      <button class="btn btn-ghost flex-1 text-xs" onclick="clearChat()">پاک کردن چت</button>
    </div>
    <p class="text-[10px]" style="color:var(--muted)">کلید OpenAI را از تنظیمات وارد کن. بدون کلید، حالت آزمایشی فعال است.</p>
  </div>
</div>

<div id="settings" class="hidden fixed inset-0 z-50 items-center justify-center p-4" style="background:rgba(0,0,0,.7);display:none" onclick="if(event.target===this)closeSettings()">
  <div class="glass w-full max-w-md p-5 space-y-3" onclick="event.stopPropagation()">
    <h2 class="font-bold">تنظیمات</h2>
    <label class="text-xs" style="color:var(--muted)">OpenAI API Key</label>
    <input id="openai-key" class="input" type="password" placeholder="sk-..."/>
    <p class="text-[11px]" style="color:var(--muted)">کلید فقط روی همین دستگاه ذخیره می‌شود.</p>
    <button class="btn btn-primary w-full" onclick="saveSettings()">ذخیره</button>
    <button class="btn btn-ghost w-full" onclick="closeSettings()">بستن</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xtyxorzyrzvzpwrtqnys.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0eXhvcnp5cnp2enB3cnRxbnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzkwMTUsImV4cCI6MjEwNTgxNTAxNX0.JaLT_49x517O5gtY9FrAJc3i5xFKjNy-CCyo7kML76I';
const OWNER_EMAIL = 'amiralihesam@gmail.com';
const SYSTEM = 'You are Lumera AI. Current year is 2026. Answer in the user language (often Persian). Be concise and accurate.';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let sessionUser = null;
let isOwner = false;
let voiceRec = null;

function $(id){ return document.getElementById(id); }
function showErr(t){ const e=$('auth-err'); e.textContent=t||''; e.classList.toggle('hidden', !t); }
function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function isOwnerEmail(email){
  const e = normEmail(email);
  return e === OWNER_EMAIL || e === 'amiralihesamgmail.com';
}

async function startAuth(){
  showErr('');
  const email = normEmail($('email').value);
  if(!email || !email.includes('@')){ showErr('ایمیل معتبر وارد کن'); return; }
  if(isOwnerEmail(email)){
    sessionUser = { email: OWNER_EMAIL, owner: true };
    isOwner = true;
    localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
    enterApp();
    return;
  }
  try{
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    if(error) throw error;
    $('email-show').textContent = email;
    $('step-email').classList.add('hidden');
    $('step-code').classList.remove('hidden');
  }catch(err){
    console.error(err);
    showErr(err.message || 'ارسال کد ناموفق. Auth Email را در Supabase روشن کن.');
  }
}

async function verifyCode(){
  showErr('');
  const email = normEmail($('email').value);
  const token = String($('code').value||'').trim();
  if(!token){ showErr('کد را وارد کن'); return; }
  try{
    const { data, error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if(error) throw error;
    sessionUser = { email, owner: false, id: data.user && data.user.id };
    isOwner = false;
    localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
    enterApp();
  }catch(err){
    console.error(err);
    showErr(err.message || 'کد اشتباه یا منقضی');
  }
}

function backEmail(){ $('step-code').classList.add('hidden'); $('step-email').classList.remove('hidden'); showErr(''); }

function enterApp(){
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent = sessionUser.email;
  const own = isOwner || isOwnerEmail(sessionUser.email);
  $('role').textContent = own ? 'مالک' : 'کاربر';
  $('role').className = 'badge' + (own ? ' owner' : '');
  if(!$('chat').dataset.ready){
    $('chat').dataset.ready = '1';
    addMsg('ai', 'سلام! من Lumera AI هستم.\nمتن بفرست، با ویس حرف بزن، یا تصویر بساز.');
  }
}

function logout(){
  localStorage.removeItem('lumera_ai_user');
  try{ sb.auth.signOut(); }catch(e){}
  location.reload();
}

function openSettings(){
  try{
    var k=$('openai-key');
    if(k) k.value = localStorage.getItem('lumera_openai_key') || '';
    var s=$('settings');
    if(s){ s.style.display = 'flex'; s.classList.remove('hidden'); }
  }catch(e){ alert('تنظیمات'); }
}
function closeSettings(){
  var s=$('settings');
  if(s){ s.style.display = 'none'; s.classList.add('hidden'); }
}
function saveSettings(){
  const k = $('openai-key').value.trim();
  if(k) localStorage.setItem('lumera_openai_key', k);
  else localStorage.removeItem('lumera_openai_key');
  closeSettings();
  addMsg('ai', 'تنظیمات ذخیره شد.');
}

function addMsg(role, text, htmlExtra){
  const div = document.createElement('div');
  div.className = 'fade flex ' + (role==='user' ? 'justify-start' : 'justify-end');
  const bubble = document.createElement('div');
  bubble.className = 'max-w-[90%] rounded-2xl px-3 py-2 text-sm whitespace-pre-wrap ' + (role==='user'?'msg-user':'msg-ai');
  bubble.innerHTML = escapeHtml(text) + (htmlExtra||'');
  div.appendChild(bubble);
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getOpenAIKey(){ return localStorage.getItem('lumera_openai_key') || ''; }

async function callOpenAIChat(userText){
  const key = getOpenAIKey();
  if(!key){
    return 'برای اتصال واقعی به OpenAI از تنظیمات API Key بگذار.\n\nپاسخ آزمایشی Lumera AI:\n' + userText + '\n\n(مرجع سال: ۲۰۲۶)';
  }
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [ {role:'system', content:SYSTEM}, {role:'user', content:userText} ]
    })
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'OpenAI error');
  return data.choices[0].message.content;
}

async function callOpenAIImage(prompt){
  const key = getOpenAIKey();
  if(!key){
    return 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=768&height=768&nologo=true&seed=' + Date.now();
  }
  const res = await fetch('https://api.openai.com/v1/images/generations', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({ model:'dall-e-3', prompt:prompt, size:'1024x1024', n:1 })
  });
  const data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || 'Image error');
  return data.data[0].url;
}

async function sendText(){
  const t = $('prompt').value.trim();
  if(!t) return;
  $('prompt').value = '';
  addMsg('user', t);
  addMsg('ai', 'در حال فکر کردن...');
  const nodes = $('chat').querySelectorAll('.msg-ai');
  const last = nodes[nodes.length-1];
  try{
    const ans = await callOpenAIChat(t);
    last.parentElement.remove();
    addMsg('ai', ans);
    speak(ans);
  }catch(e){
    last.parentElement.remove();
    addMsg('ai', 'خطا: ' + (e.message||e));
  }
}

async function sendImage(){
  const t = $('prompt').value.trim() || 'cinematic futuristic space landscape';
  addMsg('user', '[تصویر] ' + t);
  addMsg('ai', 'در حال ساخت تصویر...');
  const nodes = $('chat').querySelectorAll('.msg-ai');
  const last = nodes[nodes.length-1];
  try{
    const url = await callOpenAIImage(t);
    last.parentElement.remove();
    addMsg('ai', 'تصویر آماده شد:', '<div class="mt-2"><img src="'+url+'" alt="ai" style="border-radius:14px;max-width:100%;max-height:360px;object-fit:cover"/></div>');
    $('prompt').value = '';
  }catch(e){
    last.parentElement.remove();
    addMsg('ai', 'خطا تصویر: ' + (e.message||e));
  }
}

function clearChat(){ $('chat').innerHTML=''; $('chat').dataset.ready=''; enterApp(); }

function speak(text){
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(String(text).slice(0,500));
    u.lang = 'fa-IR';
    speechSynthesis.speak(u);
  }catch(e){}
}

function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ addMsg('ai', 'مرورگر از ویس پشتیبانی نمی‌کند.'); return; }
  if(voiceRec){ try{voiceRec.stop()}catch(e){} voiceRec=null; return; }
  voiceRec = new SR();
  voiceRec.lang = 'fa-IR';
  voiceRec.onresult = (ev) => { $('prompt').value = ev.results[0][0].transcript; sendText(); voiceRec=null; };
  voiceRec.onerror = () => { voiceRec=null; addMsg('ai','خطا در ویس'); };
  voiceRec.onend = () => { voiceRec=null; };
  voiceRec.start();
  addMsg('ai', 'گوش می‌دهم...');
}

(async function(){
  try{
    const saved = localStorage.getItem('lumera_ai_user');
    if(saved){
      sessionUser = JSON.parse(saved);
      isOwner = !!(sessionUser.owner || isOwnerEmail(sessionUser.email));
      enterApp();
      return;
    }
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){
      sessionUser = { email: data.session.user.email, id: data.session.user.id, owner: isOwnerEmail(data.session.user.email) };
      isOwner = sessionUser.owner;
      localStorage.setItem('lumera_ai_user', JSON.stringify(sessionUser));
      enterApp();
    }
  }catch(e){}
})();
</script>
</body>
</html>
