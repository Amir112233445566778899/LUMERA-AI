<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#000000"/>
<title>Lumera Dark</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--fg:#e8e8e8;--muted:#6b6b6b;--line:#1a1a1a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:#000;color:var(--fg);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(80,0,0,.35),transparent 55%),#000;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:18px 14px 48px}
  header{text-align:center;padding:28px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  header h1{font-size:1.6rem;letter-spacing:.28em;font-weight:900;text-shadow:0 0 24px rgba(139,0,0,.55)}
  header p{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:.12em}
  .card{border:1px solid var(--line);background:rgba(10,10,10,.92);border-radius:14px;padding:14px;margin-bottom:12px}
  .meta{font-size:10px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
  .body{font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .card img,.card video{width:100%;border-radius:10px;margin-top:10px;max-height:360px;object-fit:cover;background:#0a0a0a}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px}
  textarea,input{width:100%;background:#0a0a0a;border:1px solid #222;color:#eee;border-radius:12px;padding:12px;font:inherit;outline:none}
  textarea:focus,input:focus{border-color:#5c1010;box-shadow:0 0 0 3px rgba(139,0,0,.15)}
  .btn{border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;cursor:pointer;width:100%}
  .btn-main{background:linear-gradient(135deg,#4a0000,#1a0000);color:#f5f5f5;border:1px solid #5c1010}
  .btn-ghost{background:transparent;color:#aaa;border:1px solid #222;margin-top:8px}
  .row{display:flex;gap:8px;margin-top:8px}
  .row label.btn{flex:1;text-align:center}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1a0505;border:1px solid #5c1010;color:#eee;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .toast.on{opacity:1}
  #view-public,#view-owner{display:none}
  #view-public.on,#view-owner.on{display:block}
  .owner-banner{font-size:11px;color:#c4c4c4;border:1px dashed #3a1010;background:rgba(40,0,0,.35);border-radius:12px;padding:10px 12px;margin-bottom:12px;line-height:1.6}
  .log-item{font-size:11px;color:#9a9a9a;border-bottom:1px solid #151515;padding:8px 0}
  .log-item b{color:#ddd}
  .foot{text-align:center;margin-top:22px;font-size:10px;color:#333;letter-spacing:.2em}
  .splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
  .splash.go{opacity:0;pointer-events:none}
  .splash h2{letter-spacing:.4em;font-size:1.4rem;text-shadow:0 0 30px rgba(139,0,0,.8)}
  .err{color:#f87171;font-size:12px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="splash" id="splash"><h2>LUMERA DARK</h2></div>
<div class="toast" id="toast"></div>
<div class="wrap">
  <header>
    <h1>LUMERA DARK</h1>
    <p>فضای اطلاعیه · ناشناس</p>
  </header>

  <section id="view-public">
    <div id="feed" class="empty">در حال بارگذاری...</div>
    <div class="foot">ANONYMOUS · SILENT · DARK</div>
  </section>

  <section id="view-owner">
    <div class="owner-banner">
      این صفحه فقط برای دستگاه مالک باز است. اطلاعیه‌ها برای همه به‌صورت ناشناس منتشر می‌شوند.
    </div>
    <div class="card">
      <div class="meta"><span>انتشار اطلاعیه</span><span>ناشناس</span></div>
      <textarea id="p-body" rows="5" placeholder="متن اطلاعیه..."></textarea>
      <div class="row">
        <label class="btn btn-ghost">عکس<input type="file" accept="image/*" id="p-img" hidden/></label>
        <label class="btn btn-ghost">فیلم<input type="file" accept="video/*" id="p-vid" hidden/></label>
      </div>
      <div id="preview" style="margin-top:8px"></div>
      <button class="btn btn-main" style="margin-top:10px" id="btn-pub" type="button">انتشار ناشناس</button>
    </div>
    <div class="card">
      <div class="meta"><span>ورودها</span><span>زمان · IP · مدل دستگاه</span></div>
      <div id="logs"><div class="empty" style="padding:16px">خالی</div></div>
    </div>
    <div class="card">
      <div class="meta"><span>اطلاعیه‌های منتشرشده</span><span></span></div>
      <div id="owner-feed"></div>
    </div>
  </section>
</div>
<script>
(function(){
  var SB_URL = 'https://xtyxorzyrzvzpwrtqnys.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0eXhvcnp5cnp2enB3cnRxbnlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMzkwMTUsImV4cCI6MjEwNTgxNTAxNX0.JaLT_49x517O5gtY9FrAJc3i5xFKjNy-CCyo7kML76I';
  var LS_TOKEN = 'ld_owner_token_v3';
  var sb = supabase.createClient(SB_URL, SB_KEY);
  var isOwner = false;
  var myToken = localStorage.getItem(LS_TOKEN) || '';
  var mediaData = null;

  function $(id){ return document.getElementById(id); }
  function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('on'); setTimeout(function(){ el.classList.remove('on'); }, 2200); }
  function nowISO(){ return new Date().toISOString(); }
  function faTime(iso){ try{ return new Date(iso).toLocaleString('fa-IR'); }catch(e){ return iso; } }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  function getWebGLRenderer(){
    try{
      var c=document.createElement('canvas');
      var gl=c.getContext('webgl')||c.getContext('experimental-webgl');
      if(!gl) return '';
      var ext=gl.getExtension('WEBGL_debug_renderer_info');
      if(!ext) return String(gl.getParameter(gl.RENDERER)||'');
      return String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'');
    }catch(e){ return ''; }
  }
  function inferIPhoneModel(){
    var w=Math.min(screen.width, screen.height);
    var h=Math.max(screen.width, screen.height);
    var r=window.devicePixelRatio||1;
    var gpu=(getWebGLRenderer()||'').toLowerCase();
    var key=w+'x'+h+'@'+r;
    var map={
      '320x568@2':'iPhone SE (1st) / 5s','375x667@2':'iPhone 6/6s/7/8 / SE (2nd/3rd)',
      '414x736@3':'iPhone 6/6s/7/8 Plus','375x812@3':'iPhone X/XS/11 Pro / 12 mini / 13 mini',
      '414x896@2':'iPhone XR / 11','414x896@3':'iPhone XS Max / 11 Pro Max',
      '360x780@3':'iPhone 12 mini / 13 mini','390x844@3':'iPhone 12/13/14',
      '428x926@3':'iPhone 12/13/14 Pro Max','393x852@3':'iPhone 14 Pro / 15 / 15 Pro / 16',
      '430x932@3':'iPhone 14 Pro Max / 15 Plus / 15 Pro Max / 16 Plus',
      '402x874@3':'iPhone 16 Pro','440x956@3':'iPhone 16 Pro Max'
    };
    var base=map[key]||'';
    if(base){
      if(gpu.indexOf('a18')>=0) base+=' (A18)';
      else if(gpu.indexOf('a17')>=0) base+=' (A17)';
      else if(gpu.indexOf('a16')>=0) base+=' (A16)';
      else if(gpu.indexOf('a15')>=0) base+=' (A15)';
      else if(gpu.indexOf('a14')>=0) base+=' (A14)';
      return base;
    }
    if(/iphone/i.test(navigator.userAgent||'')) return 'iPhone · '+key;
    if(/ipad/i.test(navigator.userAgent||'')) return 'iPad · '+key;
    return '';
  }
  function parseAndroidModel(ua){
    var m=(ua||'').match(/Android\s+[\d.]+;\s*([^;)]+?)(?:\s+Build|[);])/i);
    if(m&&m[1]){ var name=m[1].trim(); if(!/^(wv|Mobile|U|en-us|en-gb)$/i.test(name)) return name; }
    return '';
  }
  async function getDeviceExact(){
    var ua=navigator.userAgent||'';
    var parts=[];
    try{
      if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){
        var ch=await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion']);
        if(ch.model&&String(ch.model).trim()) parts.push(String(ch.model).trim());
        if(ch.platform) parts.push(ch.platform+(ch.platformVersion?(' '+ch.platformVersion):''));
      }
    }catch(e){}
    if(/Android/i.test(ua)){ var am=parseAndroidModel(ua); if(am) parts.unshift(am); }
    if(/iPhone|iPad|iOS/i.test(ua)||/iP(hone|ad|od)/.test(navigator.platform||'')){
      var inf=inferIPhoneModel(); if(inf) parts.unshift(inf);
      var ios=ua.match(/OS\s([\d_]+)/); if(ios) parts.push('iOS '+ios[1].replace(/_/g,'.'));
    }
    if(!parts.length){
      if(/Windows NT 10/.test(ua)) parts.push('Windows 10/11');
      else if(/Mac OS X ([\d_]+)/.test(ua)) parts.push('Mac '+RegExp.$1.replace(/_/g,'.'));
      else parts.push((ua||'Unknown').slice(0,80));
    }
    var gpu=getWebGLRenderer();
    if(gpu&&/Android/i.test(ua)){ var g=gpu.replace(/ANGLE\s*\(|\)/g,'').replace(/\s+/g,' ').trim().slice(0,50); if(g) parts.push(g); }
    parts.push((screen.width||'?')+'x'+(screen.height||'?')+'@'+(window.devicePixelRatio||1)+'x');
    return parts.filter(Boolean).join(' · ');
  }
  async function fetchIP(){
    try{ var r=await fetch('https://api.ipify.org?format=json',{cache:'no-store'}); var j=await r.json(); return j.ip||'—'; }
    catch(e){ return '—'; }
  }

  async function ensureOwner(){
    // خواندن مالک فعلی از سرور
    var res = await sb.from('ld_meta').select('owner_token,created_at').eq('id',1).maybeSingle();
    if(res.error) throw res.error;
    var row = res.data;

    if(!row){
      // هنوز مالکی نیست → این بازدیدکننده مالک دائمی می‌شود
      var token = 'ow_'+Math.random().toString(36).slice(2)+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
      var ins = await sb.from('ld_meta').insert({ id:1, owner_token: token }).select().maybeSingle();
      if(ins.error){
        // ممکن است همزمان نفر دیگری ثبت کرده باشد
        var again = await sb.from('ld_meta').select('owner_token').eq('id',1).maybeSingle();
        if(again.data && again.data.owner_token){
          row = again.data;
        } else {
          throw ins.error;
        }
      } else {
        localStorage.setItem(LS_TOKEN, token);
        myToken = token;
        isOwner = true;
        return;
      }
    }

    // مالک از قبل وجود دارد
    myToken = localStorage.getItem(LS_TOKEN) || '';
    if(myToken && row.owner_token && myToken === row.owner_token){
      isOwner = true;
    } else {
      isOwner = false;
      // اگر کسی توکن جعلی داشت پاک شود
      if(myToken && myToken !== row.owner_token){
        localStorage.removeItem(LS_TOKEN);
        myToken = '';
      }
    }
  }

  async function logVisit(){
    var ip = await fetchIP();
    var dev = '—';
    try{ dev = await getDeviceExact(); }catch(e){ dev = (navigator.userAgent||'').slice(0,100); }
    try{
      await sb.from('ld_visits').insert({
        ip: ip,
        device: dev,
        ua: (navigator.userAgent||'').slice(0,220),
        screen: (screen.width||'?')+'x'+(screen.height||'?')+'@'+(window.devicePixelRatio||1)+'x',
        role: isOwner ? 'owner-device' : 'visitor'
      });
    }catch(e){ console.log(e); }
  }

  function cardHTML(p){
    var media='';
    if(p.media_type==='image'&&p.media_url) media='<img src="'+esc(p.media_url)+'" alt=""/>';
    if(p.media_type==='video'&&p.media_url) media='<video src="'+esc(p.media_url)+'" controls playsinline></video>';
    return '<article class="card"><div class="meta"><span>اطلاعیه</span><span>'+esc(faTime(p.created_at))+'</span></div><div class="body">'
      +esc(p.body||'')+'</div>'+media+'</article>';
  }

  async function loadPostsInto(elId){
    var box = $(elId);
    var { data, error } = await sb.from('ld_posts').select('*').order('created_at',{ascending:false}).limit(100);
    if(error){ box.innerHTML = '<div class="err">خطا در بارگذاری — SQL را اجرا کن</div>'; return; }
    if(!data||!data.length){ box.className = elId==='feed'?'empty':''; box.innerHTML = elId==='feed'?'هنوز اطلاعیه‌ای نیست':'<div class="empty" style="padding:12px">خالی</div>'; return; }
    box.className = '';
    box.innerHTML = data.map(cardHTML).join('');
  }

  async function loadLogs(){
    if(!isOwner) return;
    var box = $('logs');
    var { data, error } = await sb.from('ld_visits').select('*').order('created_at',{ascending:false}).limit(80);
    if(error){ box.innerHTML = '<div class="err">خطا</div>'; return; }
    if(!data||!data.length){ box.innerHTML = '<div class="empty" style="padding:12px">خالی</div>'; return; }
    box.innerHTML = data.map(function(l){
      return '<div class="log-item"><b>'+esc(faTime(l.created_at))+'</b><br/>IP: '+esc(l.ip)
        +'<br/>مدل: '+esc(l.device)
        +'<br/>صفحه: '+esc(l.screen)
        +'<br/><span style="opacity:.55;word-break:break-all">UA: '+esc(l.ua||'')+'</span></div>';
    }).join('');
  }

  function showViews(){
    if(isOwner){
      $('view-owner').classList.add('on');
      $('view-public').classList.remove('on');
      loadPostsInto('owner-feed');
      loadLogs();
    } else {
      $('view-owner').classList.remove('on');
      $('view-public').classList.add('on');
      loadPostsInto('feed');
    }
  }

  function readFile(input, type){
    if(!isOwner) return;
    var f=input.files&&input.files[0]; if(!f) return;
    if(f.size>5.5*1024*1024){ toast('حداکثر حدود ۵ مگ'); input.value=''; return; }
    var r=new FileReader();
    r.onload=function(){
      mediaData={type:type,url:r.result};
      var prev=$('preview');
      if(type==='image') prev.innerHTML='<img src="'+r.result+'" style="width:100%;border-radius:10px;max-height:220px;object-fit:cover"/>';
      else prev.innerHTML='<video src="'+r.result+'" controls playsinline style="width:100%;border-radius:10px;max-height:220px"></video>';
    };
    r.readAsDataURL(f);
  }

  async function publish(){
    if(!isOwner){ toast('فقط مالک'); return; }
    // تأیید دوباره از سرور
    var chk = await sb.from('ld_meta').select('owner_token').eq('id',1).maybeSingle();
    if(!chk.data || chk.data.owner_token !== myToken){
      isOwner = false; localStorage.removeItem(LS_TOKEN); toast('دسترسی نیست'); showViews(); return;
    }
    var body = ($('p-body').value||'').trim();
    if(!body && !mediaData){ toast('متن یا رسانه لازم است'); return; }
    if(/<\s*script/i.test(body)){ toast('محتوا مجاز نیست'); return; }
    var { error } = await sb.from('ld_posts').insert({
      body: body,
      media_type: mediaData?mediaData.type:'',
      media_url: mediaData?mediaData.url:''
    });
    if(error){ toast('خطا در انتشار'); console.log(error); return; }
    $('p-body').value=''; mediaData=null; $('preview').innerHTML='';
    $('p-img').value=''; $('p-vid').value='';
    toast('منتشر شد');
    loadPostsInto('owner-feed');
  }

  async function boot(){
    try{
      await ensureOwner();
      await logVisit();
      showViews();
      if(isOwner){
        $('p-img').onchange=function(){ readFile(this,'image'); };
        $('p-vid').onchange=function(){ readFile(this,'video'); };
        $('btn-pub').onclick=function(){ publish(); };
      }
    }catch(e){
      console.log(e);
      $('feed').innerHTML = '<div class="err">اتصال برقرار نشد. SQL را در Supabase اجرا کن و رفرش کن.</div>';
      $('view-public').classList.add('on');
    }
    setTimeout(function(){ $('splash').classList.add('go'); }, 700);
  }
  boot();
})();
</script>
</body>
</html>
