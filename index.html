<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumera AI</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Vazirmatn', system-ui, sans-serif;
  background: #0a0a0f;
  color: #e8e8f0;
  height: 100vh;
  overflow: hidden;
}
.screen { display: none; height: 100vh; width: 100%; }
.screen.active { display: flex; }
#login-screen {
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 0%, #1a0a2e 0%, #0a0a0f 70%);
}
.login-card {
  background: #12121a;
  border: 1px solid #2a2a3a;
  border-radius: 24px;
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(139, 92, 246, 0.15);
}
.logo { text-align: center; margin-bottom: 32px; }
.logo-icon {
  font-size: 32px;
  color: #8b5cf6;
  margin-bottom: 12px;
  text-shadow: 0 0 30px #8b5cf6;
}
.logo-icon.small {
  font-size: 20px;
  margin: 0;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(139, 92, 246, 0.1);
  border-radius: 50%;
}
.logo h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, #a78bfa, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.tagline { color: #8a8a9a; font-size: 14px; margin-top: 6px; }
.input-group { margin-bottom: 20px; }
.input-group label {
  display: block;
  font-size: 13px;
  color: #8a8a9a;
  margin-bottom: 8px;
}
.input-group input {
  width: 100%;
  padding: 14px 16px;
  background: #1a1a26;
  border: 1px solid #2a2a3a;
  border-radius: 12px;
  color: #e8e8f0;
  font-size: 15px;
  font-family: inherit;
  direction: ltr;
  text-align: left;
}
.input-group input:focus {
  outline: none;
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
}
.error-msg {
  display: block;
  color: #f87171;
  font-size: 12px;
  margin-top: 6px;
  min-height: 16px;
}
button[type="submit"] {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
.hint {
  text-align: center;
  color: #8a8a9a;
  font-size: 12px;
  margin-top: 20px;
}
#chat-screen { flex-direction: column; background: #0a0a0f; }
.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid #2a2a3a;
  background: #12121a;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.chat-header h2 { font-size: 16px; font-weight: 600; }
.status { font-size: 12px; color: #8a8a9a; }
#logout-btn {
  background: transparent;
  border: 1px solid #2a2a3a;
  color: #8a8a9a;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 18px;
  line-height: 1.7;
  font-size: 15px;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.message.user {
  align-self: flex-start;
  background: #6366f1;
  color: white;
  border-bottom-right-radius: 4px;
}
.message.assistant {
  align-self: flex-end;
  background: #1a1a26;
  border: 1px solid #2a2a3a;
  border-bottom-left-radius: 4px;
}
.message.system {
  align-self: center;
  background: transparent;
  color: #8a8a9a;
  font-size: 13px;
  text-align: center;
}
.typing { display: inline-flex; gap: 4px; align-items: center; }
.typing span {
  width: 6px;
  height: 6px;
  background: #8a8a9a;
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-6px); opacity: 1; }
}
.chat-input-area {
  padding: 16px 20px 20px;
  border-top: 1px solid #2a2a3a;
  background: #12121a;
}
#chat-form {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: #1a1a26;
  border: 1px solid #2a2a3a;
  border-radius: 16px;
  padding: 8px 8px 8px 16px;
}
#chat-form:focus-within { border-color: #8b5cf6; }
#user-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #e8e8f0;
  font-family: inherit;
  font-size: 15px;
  resize: none;
  max-height: 150px;
  padding: 10px 0;
  line-height: 1.6;
}
#user-input:focus { outline: none; }
#send-btn {
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.back-link {
  display: block;
  text-align: center;
  color: #8a8a9a;
  background: transparent;
  border: 1px solid #2a2a3a;
  border-radius: 12px;
  padding: 12px;
  margin-top: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  width: 100%;
}
</style>
</head>
<body>

<div id="login-screen" class="screen active">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <h1>Lumera AI</h1>
      <p class="tagline">هوش مصنوعی همراه شما</p>
    </div>

    <form id="login-form">
      <div class="input-group">
        <label for="email">ایمیل خود را وارد کنید</label>
        <input type="email" id="email" placeholder="ali.reza@gmail.com" required />
        <span class="error-msg" id="email-error"></span>
      </div>
      <button type="submit" id="login-btn">
        <span>ورود به Lumera</span>
      </button>
    </form>

    <form id="otp-form" style="display:none;">
      <div class="input-group">
        <label for="otp">کد ۶ رقمی ارسال شده را وارد کن</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" style="text-align:center; letter-spacing:8px; font-size:20px;" />
        <span class="error-msg" id="otp-error"></span>
      </div>
      <button type="submit" id="verify-btn">
        <span>تأیید و ورود</span>
      </button>
      <button type="button" id="back-btn" class="back-link">بازگشت</button>
    </form>

    <p class="hint">با ورود، شما قوانین استفاده را می‌پذیرید</p>
  </div>
</div>

<div id="chat-screen" class="screen">
  <header class="chat-header">
    <div class="header-left">
      <div class="logo-icon small">✦</div>
      <div>
        <h2>Lumera AI</h2>
        <span class="status" id="user-greeting">سلام!</span>
      </div>
    </div>
    <button id="logout-btn">↩</button>
  </header>

  <main id="messages" class="messages"></main>

  <footer class="chat-input-area">
    <form id="chat-form">
      <textarea id="user-input" placeholder="پیام خود را بنویسید..." rows="1" required></textarea>
      <button type="submit" id="send-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
  </footer>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://xtyxorzyrzvzpwrtqnys.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DALm5phLFNf8pf7q7Pl3Mg_KZPnwKAJ';
const OWNER_EMAIL = 'amiralihesamfar@gmail.com';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let isSending = false;
let pendingEmail = '';
let isOwner = false;

const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const loginForm = document.getElementById('login-form');
const otpForm = document.getElementById('otp-form');
const emailInput = document.getElementById('email');
const emailError = document.getElementById('email-error');
const loginBtn = document.getElementById('login-btn');
const otpInput = document.getElementById('otp');
const otpError = document.getElementById('otp-error');
const verifyBtn = document.getElementById('verify-btn');
const backBtn = document.getElementById('back-btn');
const messagesEl = document.getElementById('messages');
const chatForm = document.getElementById('chat-form');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const logoutBtn = document.getElementById('logout-btn');
const userGreeting = document.getElementById('user-greeting');

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
}

function extractNameFromEmail(email) {
  const local = email.split('@')[0];
  const cleaned = local.replace(/[._-]+/g, ' ').replace(/[0-9]+/g, '').trim().replace(/\s+/g, ' ');
  return cleaned || 'دوست عزیز';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  emailError.textContent = '';
  const email = emailInput.value.trim().toLowerCase();
  if (!isValidEmail(email)) {
    emailError.textContent = 'لطفاً یک ایمیل معتبر وارد کنید';
    return;
  }
  if (email === OWNER_EMAIL.toLowerCase()) {
    isOwner = true;
    currentUser = { id: 'owner-local', email: OWNER_EMAIL };
    currentProfile = { display_name: 'مالک', email: OWNER_EMAIL };
    localStorage.setItem('lumera_owner', 'true');
    showChatScreen();
    return;
  }
  loginBtn.disabled = true;
  loginBtn.querySelector('span').textContent = 'در حال ارسال...';
  try {
    const { error } = await supabase.auth.signInWithOtp({
      email: email,
      options: { shouldCreateUser: true }
    });
    if (error) throw error;
    pendingEmail = email;
    loginForm.style.display = 'none';
    otpForm.style.display = 'block';
    otpInput.focus();
    otpError.style.color = '#4ade80';
    otpError.textContent = 'کد به ' + email + ' ارسال شد.';
  } catch (err) {
    emailError.style.color = '#f87171';
    emailError.textContent = err.message || 'خطا در ارسال کد.';
    loginBtn.disabled = false;
    loginBtn.querySelector('span').textContent = 'ورود به Lumera';
  }
});

otpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  otpError.textContent = '';
  const token = otpInput.value.trim();
  if (token.length !== 6) {
    otpError.style.color = '#f87171';
    otpError.textContent = 'کد باید ۶ رقمی باشد';
    return;
  }
  verifyBtn.disabled = true;
  verifyBtn.querySelector('span').textContent = 'در حال تأیید...';
  try {
    const { error } = await supabase.auth.verifyOtp({
      email: pendingEmail,
      token: token,
      type: 'email'
    });
    if (error) throw error;
  } catch (err) {
    otpError.style.color = '#f87171';
    otpError.textContent = 'کد اشتباه یا منقضی شده.';
    verifyBtn.disabled = false;
    verifyBtn.querySelector('span').textContent = 'تأیید و ورود';
  }
});

backBtn.addEventListener('click', () => {
  otpForm.style.display = 'none';
  loginForm.style.display = 'block';
  loginBtn.disabled = false;
  loginBtn.querySelector('span').textContent = 'ورود به Lumera';
  otpInput.value = '';
  otpError.textContent = '';
});

supabase.auth.onAuthStateChange(async (event, session) => {
  if (session && session.user) {
    currentUser = session.user;
    isOwner = false;
    await loadProfile();
    showChatScreen();
  } else if (!localStorage.getItem('lumera_owner')) {
    currentUser = null;
    currentProfile = null;
    isOwner = false;
    showLoginScreen();
  }
});

(async () => {
  if (localStorage.getItem('lumera_owner') === 'true') {
    isOwner = true;
    currentUser = { id: 'owner-local', email: OWNER_EMAIL };
    currentProfile = { display_name: 'مالک', email: OWNER_EMAIL };
    showChatScreen();
    return;
  }
  const { data } = await supabase.auth.getSession();
  if (data && data.session && data.session.user) {
    currentUser = data.session.user;
    await loadProfile();
    showChatScreen();
  }
})();

async function loadProfile() {
  if (!currentUser) return;
  const result = await supabase.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
  if (result.error || !result.data) {
    const displayName = isOwner ? 'مالک' : extractNameFromEmail(currentUser.email);
    const insertResult = await supabase.from('profiles').insert({
      id: currentUser.id,
      email: currentUser.email,
      display_name: displayName
    }).select().maybeSingle();
    currentProfile = insertResult.data || { display_name: displayName, email: currentUser.email };
  } else {
    currentProfile = result.data;
  }
  const prefix = isOwner ? '👑 ' : '';
  userGreeting.textContent = prefix + 'سلام ' + currentProfile.display_name + ' 👋';
}

function showLoginScreen() {
  loginScreen.classList.add('active');
  chatScreen.classList.remove('active');
  otpForm.style.display = 'none';
  loginForm.style.display = 'block';
  emailInput.value = '';
  otpInput.value = '';
  loginBtn.disabled = false;
  loginBtn.querySelector('span').textContent = 'ورود به Lumera';
  verifyBtn.disabled = false;
  verifyBtn.querySelector('span').textContent = 'تأیید و ورود';
}

function showChatScreen() {
  loginScreen.classList.remove('active');
  chatScreen.classList.add('active');
  messagesEl.innerHTML = '';
  const name = currentProfile ? currentProfile.display_name : 'دوست عزیز';
  const greeting = isOwner
    ? '👑 سلام مالک عزیز ' + name + '! به Lumera خوش آمدی.'
    : 'سلام ' + name + '! من Lumera هستم. چطور می‌تونم کمکت کنم؟ 🌟';
  showSystemMessage(greeting);
  userInput.focus();
}

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showSystemMessage(text) { addMessage('system', text); }

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (isSending) return;
  const text = userInput.value.trim();
  if (!text) return;
  isSending = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';
  addMessage('user', text);
  showTyping();
  try {
    const { data, error } = await supabase.functions.invoke('chat', {
      body: {
        message: text,
        userName: currentProfile ? currentProfile.display_name : 'کاربر',
        isOwner: isOwner
      }
    });
    removeTyping();
    if (error) throw error;
    const reply = (data && data.reply) ? data.reply : 'متأسفم، پاسخی دریافت نشد.';
    addMessage('assistant', reply);
  } catch (err) {
    removeTyping();
    addMessage('assistant', '⚠️ خطا در ارتباط با سرور.');
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    chatForm.requestSubmit();
  }
});

logoutBtn.addEventListener('click', async () => {
  localStorage.removeItem('lumera_owner');
  await supabase.auth.signOut();
  isOwner = false;
  currentUser = null;
  currentProfile = null;
  showLoginScreen();
});
</script>
</body>
</html>
